<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0708">
<title>六爻·临阵｜无畏契约</title>
<style>
:root{--bg:#0b0708;--card:#16100f;--line:#3a2420;--gold:#e8b85a;--gold2:#ffd98a;--red:#c8322a;--red2:#ff5a3c;--txt:#efe6da;--dim:#a8998a;--ok:#7fc98a;--bad:#ff7b6b;--mid:#e8c46a}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;overflow-x:hidden}
body{background:radial-gradient(ellipse at 50% -10%,#3a1410 0%,#160b0a 45%,#0b0708 80%) fixed}
.wrap{max-width:640px;margin:0 auto;padding:14px 12px 60px}
h1{margin:6px 0 2px;text-align:center;font-size:30px;letter-spacing:6px;color:var(--gold2);text-shadow:0 0 12px rgba(255,90,60,.7),0 0 28px rgba(232,184,90,.35)}
.sub{text-align:center;color:var(--dim);font-size:12px;margin-bottom:10px}
.card{background:linear-gradient(180deg,rgba(40,18,14,.85),rgba(22,16,15,.92));border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 0 18px rgba(200,50,42,.12) inset}
.lbl{font-weight:600;color:var(--gold);margin:4px 0 6px;font-size:14px}
.lbl small{color:var(--dim);font-weight:400}
select{width:100%;background:#1d1412;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.hgrp{margin:4px 0 6px}.hgrp>.note{display:block;margin-bottom:3px}
.chip{border:1px solid var(--line);background:#1d1412;color:var(--txt);border-radius:16px;padding:6px 11px;font-size:14px;cursor:pointer;user-select:none}
.chip.on{border-color:var(--gold);background:linear-gradient(180deg,#5a2418,#331410);color:var(--gold2);box-shadow:0 0 8px rgba(232,184,90,.35)}
.chip.dis{opacity:.35;text-decoration:line-through}
.prof{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.prow{display:flex;align-items:center;gap:6px;font-size:14px}
.prow span{flex:1}
.mini{background:#241815;border:1px solid var(--line);color:var(--gold);border-radius:6px;padding:2px 9px;font-size:13px;cursor:pointer}
details{margin:6px 0}
summary{cursor:pointer;color:var(--gold);font-size:14px;padding:4px 0}
.go{position:relative;display:block;width:100%;margin:16px 0 6px;padding:18px 10px;font-size:21px;font-weight:700;letter-spacing:2px;color:#fff3dc;border:1px solid var(--gold);border-radius:14px;cursor:pointer;
 background:linear-gradient(180deg,#b3271c,#6e130d);box-shadow:0 0 18px rgba(255,90,60,.55),0 0 40px rgba(232,184,90,.25);overflow:hidden}
.go:disabled{opacity:.55;cursor:default}
.go::after{content:none}
@keyframes sh{to{transform:translateX(100%)}}
.msg{color:var(--bad);text-align:center;font-size:14px;margin:4px 0}.msg:empty{display:none}
.runes{position:relative;height:150px;display:none;align-items:center;justify-content:center;overflow:hidden}
.runes.on{display:flex}
.ring{position:absolute;width:140px;height:140px;border-radius:50%;border:1px dashed rgba(232,184,90,.55);animation:spin 6s linear infinite;box-shadow:0 0 20px rgba(255,90,60,.35)}
.ring span{position:absolute;left:50%;top:50%;color:var(--gold2);font-size:18px;text-shadow:0 0 8px var(--red2)}
@keyframes spin{to{transform:rotate(360deg)}}
.yaos{position:relative;display:flex;flex-direction:column-reverse;gap:5px;width:90px;z-index:2}
.yao{height:9px;display:flex;gap:10px;opacity:0;transform:scaleX(.2);transition:all .25s}
.yao.show{opacity:1;transform:none}
.yao i{flex:1;background:linear-gradient(90deg,var(--gold),var(--red2));border-radius:2px;box-shadow:0 0 6px var(--red2)}
.yao.mv i{background:linear-gradient(90deg,#fff1c8,var(--gold2))}
.castq{text-align:center;color:var(--gold2);font-size:13px;min-height:40px;padding:0 6px}
.order{border:1px solid var(--gold);box-shadow:0 0 22px rgba(232,184,90,.25),0 0 18px rgba(200,50,42,.25) inset}
.order h2{margin:10px 0 4px;font-size:16px;color:var(--gold2);border-left:3px solid var(--red2);padding-left:8px}
.order h2:first-child{margin-top:0}
.kv{display:flex;gap:6px;margin:3px 0;word-break:break-word}
.kv b{flex:0 0 auto;color:var(--gold);font-weight:600;min-width:4.5em}
.kv div{flex:1;min-width:0}
.src{display:block;color:var(--dim);font-size:11px}
.tag{display:inline-block;font-size:11px;border-radius:4px;padding:0 5px;margin-right:4px;border:1px solid}
.t1{color:#9cc8ff;border-color:#33557a}.t2{color:#e8c46a;border-color:#6b5520}.t3{color:#7fc98a;border-color:#2f5b37}.t4{color:#c9a0ff;border-color:#4b3473}
.v-支持{color:var(--ok)}.v-不支持{color:var(--bad)}.v-混杂{color:var(--mid)}.v-待解{color:#c9a0ff}
.flex{margin:6px 0 2px;padding:6px 8px;border:1px dashed var(--line);border-radius:8px;background:rgba(18,12,11,.6)}
.flex .kv b{min-width:5.5em;color:var(--mid)}
.entry{font-size:12.5px;color:var(--dim);text-align:center;margin:2px 0 4px}
.or{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12px;margin:14px 0 4px}.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.ev{font-size:13px;margin:2px 0 2px 6px}.ev i{font-style:normal;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-right:4px;color:var(--dim)}
.ev.p{color:#bfe6c4}.ev.m{color:#ffb4a8}
.ban{font-size:16px;color:var(--gold2);text-shadow:0 0 8px rgba(255,90,60,.5)}
.note{font-size:12px;color:var(--dim)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btn{flex:1 1 140px;padding:11px;border-radius:10px;border:1px solid var(--gold);background:#2a1512;color:var(--gold2);font-size:15px;cursor:pointer}
.gua{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.chart{font-family:"SFMono-Regular",Menlo,Consolas,monospace;font-size:12.5px;line-height:1.55;white-space:pre-wrap;word-break:break-all;background:#120c0b;border:1px solid var(--line);border-radius:8px;padding:8px}
.li{margin:2px 0;font-size:13.5px;word-break:break-word}
.term{background:none;border:0;border-bottom:1px dotted var(--gold);color:inherit;padding:0;font:inherit;cursor:help}
#tip{position:fixed;left:8px;right:8px;bottom:10px;max-width:620px;margin:0 auto;background:#21130f;border:1px solid var(--gold);border-radius:12px;padding:12px 14px;display:none;z-index:9;box-shadow:0 0 24px rgba(0,0,0,.7)}
#tip.on{display:block}
.hist{font-size:13px}
.hist button{display:block;width:100%;text-align:left;margin:4px 0;background:#1d1412;border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:7px;cursor:pointer;font-size:13px}
footer{color:var(--dim);font-size:11.5px;line-height:1.6;margin-top:18px}
.hide{display:none!important}
.lock{pointer-events:none;opacity:.6}
.btn.sm{flex:0 1 auto;padding:6px 12px;font-size:13px;border-color:var(--line);color:var(--dim)}
.prepres h2,.order h2{margin:10px 0 4px;font-size:16px;color:var(--gold2);border-left:3px solid var(--red2);padding-left:8px}
.prepres h2:first-child{margin-top:0}
.maps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:560px){.maps{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;min-height:76px;border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;color:var(--txt);text-align:left;font:inherit;overflow:hidden;
 background:linear-gradient(135deg,hsla(var(--h),55%,28%,.95),hsla(var(--h),40%,10%,.95) 70%),#120c0b}
.tile::before{content:"";position:absolute;right:-18px;bottom:-18px;width:80px;height:80px;border:2px solid hsla(var(--h),70%,60%,.25);border-radius:50%;box-shadow:0 0 0 10px hsla(var(--h),70%,60%,.08)}
.tile b{display:block;font-size:19px;color:var(--gold2);letter-spacing:1px}
.tile i{display:block;font-style:normal;font-size:12px;color:var(--dim)}
.tile .bd{display:inline-block;margin-top:6px;font-size:11px;border-radius:4px;padding:0 5px;border:1px solid var(--gold);color:var(--gold)}
.tile .bd.lim{border-color:#6b5520;color:var(--mid)}
.tile.on{border-color:var(--gold2);box-shadow:0 0 0 2px var(--gold) inset,0 0 18px rgba(232,184,90,.45)}
.sideTg{display:flex;margin:8px 0;border:1px solid var(--gold);border-radius:10px;overflow:hidden}
.sideTg button{flex:1;padding:9px;font-size:16px;font-weight:700;background:#1d1412;color:var(--dim);border:0;cursor:pointer}
.sideTg button.on{background:linear-gradient(180deg,#b3271c,#6e130d);color:#fff3dc}
.order{animation:unf .3s ease-out}
@keyframes unf{from{opacity:.3;transform:translateY(-6px) scaleY(.96)}to{opacity:1;transform:none}}
.gst{font-size:13px;color:var(--mid);margin:4px 0}
.lim{color:var(--mid)}
.anim{position:fixed;left:0;right:0;top:0;z-index:20;display:none;align-items:center;gap:12px;padding:10px 14px;background:linear-gradient(180deg,rgba(60,14,10,.97),rgba(22,10,9,.95));border-bottom:1px solid var(--gold);box-shadow:0 4px 18px rgba(0,0,0,.6);cursor:pointer}
.anim.on{display:flex}
.anim .yaos{width:60px;flex:0 0 60px;gap:3px}
.anim .yao{height:6px}
.aq{flex:1;min-width:0;font-size:13px;color:var(--gold2);word-break:break-word}
.g2{background:linear-gradient(180deg,#3a2418,#1d1210);color:var(--gold2);font-size:19px;padding:14px 10px;box-shadow:0 0 10px rgba(232,184,90,.2)}
.g2::after{display:none}
.go{margin:12px 0 4px}
.done{text-align:center;color:var(--gold2);font-size:15px;padding:12px;border:1px solid var(--line);border-radius:12px;background:rgba(40,18,14,.6);margin:10px 0}
.done .btn{margin-left:8px}
.who{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.who .hn{font-size:24px;font-weight:700;color:var(--gold2);letter-spacing:1px}
.row{margin:8px 0;padding:6px 0;border-top:1px solid rgba(58,36,32,.7)}
.row:first-of-type{border-top:0}
.row b{display:block;color:var(--gold);font-size:13px;margin-bottom:1px}
.row div{font-size:16px;line-height:1.55;word-break:break-word}
.row.mem div{color:var(--gold2);font-size:17px}
.alt{padding:6px 12px;border-radius:16px;border:1px solid var(--gold);background:#2a1512;color:var(--gold2);font-size:14px;cursor:pointer}
.mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mh b{font-size:18px;color:var(--gold2)}
.pnote{font-size:12px;color:var(--mid);margin-top:2px}
@media (prefers-reduced-motion: reduce){.order{animation:none}.go::after{animation:none}.yao{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<h1>六爻·临阵</h1>
<div class="sub">无畏契约 · 玩谁 · 去哪 · 怎么打 · 什么时候撤</div>

<!-- 匹配前：备战（可跳过） -->
<section id="stPrep">
 <button class="go g2" id="prep" type="button">备战</button>
 <div class="entry" id="prepHint">匹配前点一下（可跳过）</div>
</section>
<section id="stWait" class="hide">
 <div class="done" id="prepRes"></div>
</section>

<!-- 匹配后：选地图 → 出征 -->
<section id="stMap">
 <div class="lbl">匹配到哪张图？</div>
 <div class="maps" id="maps"></div>
 <button class="go" id="deploy" type="button" disabled>⚔️ 出征</button>
 <div class="entry" id="mapNote"></div>
 <div class="card"><details id="setBox"><summary>我的英雄池 <span class="note" id="setSum"></span></summary>
  <div id="heroes"></div>
  <details id="moreSet"><summary>更多：熟练度 / 偏好 / 常犯的问题</summary>
   <div class="lbl" style="margin-top:6px">熟练度排序 <small>（只在能力条件相同时排先后）</small></div>
   <div class="prof" id="prof"></div>
   <div class="lbl" style="margin-top:8px">打法偏好 <small>（只在卦象分不出高下时参考）</small></div>
   <div class="chips" id="pref"></div>
   <div class="lbl" style="margin-top:8px">我常犯的问题</div>
   <div class="chips" id="habits"></div>
  </details>
 </details></div>
</section>
<div class="msg" id="msg" role="alert"></div>

<!-- 战令 -->
<section id="stOrder" class="hide">
 <div class="note" id="roNote"></div>
 <div class="card order" id="order"></div>
 <div class="btns">
  <button class="btn" id="copy" type="button">📋 一键复制完整临阵分析</button>
  <button class="btn" id="again" type="button">🔄 新一场</button>
 </div>
 <div class="note" id="copyMsg"></div>
 <div class="card"><details id="basisBox"><summary>查看卦象依据</summary><div id="basis"></div></details></div>
</section>

<div class="card"><details id="aboutBox"><summary>关于判断</summary><div class="note" id="about"></div></details></div>
<div class="card hist"><details id="histBox"><summary>历史记录</summary><div id="hist"></div></details></div>
<footer id="foot"></footer>
</div>
<div id="tip" role="dialog"></div>
<div id="anim" class="anim" role="status" aria-live="polite"><div class="yaos" id="yaos"></div><div class="aq"><div id="castq"></div><div class="note">点击跳过</div></div></div>

<script type="application/json" id="liuyao-data">{"guas": [{"n": 1, "sym": "䷀", "name": "乾", "upper": "乾", "lower": "乾", "bits": "111111", "guaci": "乾：元亨。利貞。", "yao": ["初九：潛龍勿用。", "九二：見龍在田，利見大人。", "九三：君子終日乾乾，夕惕若；厲，无咎。", "九四：或躍在淵，无咎。", "九五：飛龍在天，利見大人。", "上九：亢龍，有悔。"], "yong": "用九：見羣龍无首，吉。"}, {"n": 2, "sym": "䷁", "name": "坤", "upper": "坤", "lower": "坤", "bits": "000000", "guaci": "坤：元亨。利牝馬之貞。君子有攸往，先迷後得主。利西南得朋，東北喪朋。安貞，吉。", "yao": ["初六：履霜，堅冰至。", "六二：直方大，不習无不利。", "六三：含章，可貞。或從王事，无成有終。", "六四：括囊，无咎无譽。", "六五：黃裳，元吉。", "上六：龍戰于野，其血玄黃。"], "yong": "用六：利永貞。"}, {"n": 3, "sym": "䷂", "name": "屯", "upper": "坎", "lower": "震", "bits": "100010", "guaci": "屯：元亨，利貞。勿用有攸往，利建侯。", "yao": ["初九：磐（一作盤）桓，利居貞，利建侯。", "六二：屯如邅如，乘馬班如，匪寇婚媾，女子貞不字，十年乃字。", "六三：即鹿无虞，惟入于林中，君子幾不如舍，往吝。", "六四：乘馬班如，求婚媾，往，吉无不利。", "九五：屯其膏；小貞吉，大貞凶。", "上六：乘馬班如，泣血漣如。"], "yong": null}, {"n": 4, "sym": "䷃", "name": "蒙", "upper": "艮", "lower": "坎", "bits": "010001", "guaci": "蒙：亨。匪我求童蒙，童蒙求我。初筮告，再三瀆，瀆則不告。利貞。", "yao": ["初六：發蒙，利用刑人，用說桎梏，以往吝。", "九二：包蒙吉，納婦吉，子克家。", "六三：勿用取（一作娶）女，見金夫，不有躬，无攸利。", "六四：困蒙，吝。", "六五：童蒙，吉。", "上九：擊蒙，不利為寇，利禦寇。"], "yong": null}, {"n": 5, "sym": "䷄", "name": "需", "upper": "坎", "lower": "乾", "bits": "111010", "guaci": "需：有孚，光亨。貞吉，利涉大川。", "yao": ["初九：需于郊，利用恆，无咎。", "九二：需于沙，小有言，終吉。", "九三：需于泥，致寇至。", "六四：需于血，出自穴。", "九五：需于酒食，貞吉。", "上六：入于穴，有不速之客三人來，敬之終吉。"], "yong": null}, {"n": 6, "sym": "䷅", "name": "訟", "upper": "乾", "lower": "坎", "bits": "010111", "guaci": "訟：有孚，窒，惕，中吉，終凶。利見大人，不利涉大川。", "yao": ["初六：不永所事，小有言，終吉。", "九二：不克訟，歸而逋，其邑人三百戶无眚。", "六三：食舊德，貞厲，終吉。或從王事，无成。", "九四：不克訟，復即命渝，安貞吉。", "九五：訟，元吉。", "上九：或錫之鞶帶，終朝三褫（一作拕）之。"], "yong": null}, {"n": 7, "sym": "䷆", "name": "師", "upper": "坤", "lower": "坎", "bits": "010000", "guaci": "師：貞丈人吉，无咎。", "yao": ["初六：師出以律，否臧，凶。", "九二：在師中吉，无咎；王三錫命。", "六三：師或輿尸，凶。", "六四：師左次，无咎。", "六五：田有禽，利執言，无咎。長子帥師，弟子輿尸，貞凶。", "上六：大君有命，開國承家，小人勿用。"], "yong": null}, {"n": 8, "sym": "䷇", "name": "比", "upper": "坎", "lower": "坤", "bits": "000010", "guaci": "比：吉。原筮元永貞，无咎。不寧方來，後夫凶。", "yao": ["初六：有孚，比之，无咎。有孚盈缶，終來有它，吉。", "六二：比之自內，貞吉。", "六三：比之匪人。", "六四：外比之，貞吉。", "九五：顯比。王用三敺（一作驅），失前禽，邑人不誡，吉。", "上六：比之无首，凶。"], "yong": null}, {"n": 9, "sym": "䷈", "name": "小畜", "upper": "巽", "lower": "乾", "bits": "111011", "guaci": "小畜：亨。密雲不雨，自我西郊。", "yao": ["初九：復自道，何其咎，吉。", "九二：牽復，吉。", "九三：車（一作輿）說輹（一作輻），夫妻反目。", "六四：有孚，血去惕出，无咎。", "九五：有孚攣如，富以其鄰。", "上九：既雨既處，尚得（一作德）載，婦貞厲，月幾望，君子征凶。"], "yong": null}, {"n": 10, "sym": "䷉", "name": "履", "upper": "乾", "lower": "兌", "bits": "110111", "guaci": "履虎尾，不咥人，亨。", "yao": ["初九：素履，往无咎。", "九二：履道坦坦，幽人貞吉。", "六三：眇能視，跛能履，履虎尾，咥人，凶。武人為于大君。", "九四：履虎尾，愬愬終吉。", "九五：夬履，貞厲。", "上九：視履考詳，其旋元吉。"], "yong": null}, {"n": 11, "sym": "䷊", "name": "泰", "upper": "坤", "lower": "乾", "bits": "111000", "guaci": "泰：小往大來，吉亨。", "yao": ["初九：拔茅茹以其彙，征吉。", "九二：包荒。用馮河，不遐遺；朋亡。得尚于中行。", "九三：无平不陂，无往不復，艱貞无咎。勿恤其孚，于食有福。", "六四：翩翩，不富以其鄰；不戒以孚。", "六五：帝乙歸妹，以祉，元吉。", "上六：城復于隍，勿用師，自邑告命，貞吝。"], "yong": null}, {"n": 12, "sym": "䷋", "name": "否", "upper": "乾", "lower": "坤", "bits": "000111", "guaci": "否之匪人，不利君子貞，大往小來。", "yao": ["初六，拔茅茹以其彙，貞吉。亨。", "六二，包承，小人吉，大人否。亨。", "六三，包羞。", "九四，有命，无咎，疇離祉。", "九五，休否，大人吉。其亡其亡，繫于包（一作苞）桑。", "上九，傾否，先否後喜。"], "yong": null}, {"n": 13, "sym": "䷌", "name": "同人", "upper": "乾", "lower": "離", "bits": "101111", "guaci": "同人于野，亨。 利涉大川，利君子貞。", "yao": ["初九：同人于門，無咎。", "六二：同人于宗，吝。", "九三：伏戎于莽，升其高陵，三歲不興。", "九四：乘其庸（一作墉），弗克攻，吉。", "九五：同人，先號啕而後笑。大師克相遇。", "上九：同人于郊，無悔。"], "yong": null}, {"n": 14, "sym": "䷍", "name": "大有", "upper": "離", "lower": "乾", "bits": "111101", "guaci": "大有：元亨。", "yao": ["初九：无交害，匪咎，艱則无咎。", "九二：大轝（一作車）以載，有攸往，无咎。", "九三：公用亨于天子，小人弗克。", "九四：匪其尫（一作彭），无咎。", "六五：厥孚交如，威如；吉。", "上九：自天佑（一作右）之，吉无不利。"], "yong": null}, {"n": 15, "sym": "䷎", "name": "謙", "upper": "坤", "lower": "艮", "bits": "001000", "guaci": "謙：亨，君子有終。", "yao": ["初六：謙謙君子，用涉大川，吉。", "六二：鳴謙，貞吉。", "九三：勞謙君子，有終吉。", "六四：无不利，撝謙。", "六五：不富，以其鄰，利用侵伐，无不利。", "上六：鳴謙，利用行師，征邑國。"], "yong": null}, {"n": 16, "sym": "䷏", "name": "豫", "upper": "震", "lower": "坤", "bits": "000100", "guaci": "豫：利建侯行師。", "yao": ["初六：鳴豫，凶。", "六二：介于石，不終日，貞吉。", "六三：盱豫，悔。遲有悔。", "九四：由豫，大有得。勿疑。朋盍戠（一作簪）。", "六五：貞疾，恆不死。", "上六：冥豫，成有渝，无咎。"], "yong": null}, {"n": 17, "sym": "䷐", "name": "隨", "upper": "兌", "lower": "震", "bits": "100110", "guaci": "隨：元亨。利貞。无咎。", "yao": ["初九：官有渝，貞吉。出門交有功。", "六二：係小子，失丈夫。", "六三：係丈夫，失小子。隨，有求得利，居貞。", "九四：隨有獲，貞凶。有孚在道，以明，何咎。", "九五：孚于嘉，吉。", "上六：拘係之，乃從維之。王用亨于西山。"], "yong": null}, {"n": 18, "sym": "䷑", "name": "蠱", "upper": "艮", "lower": "巽", "bits": "011001", "guaci": "蠱：元亨。利涉大川。先甲三日，後甲三日。", "yao": ["初六：幹父之蠱，有子考，无咎，厲終吉。", "九二：幹母之蠱，不可貞。", "九三：幹父之蠱，小有悔，无大咎。", "六四：裕父之蠱，往見吝。", "六五：幹父之蠱，用譽。", "上九：不事王侯，高尚其事。"], "yong": null}, {"n": 19, "sym": "䷒", "name": "臨", "upper": "坤", "lower": "兌", "bits": "110000", "guaci": "臨：元亨。利貞。至于八月有凶。", "yao": ["初九：咸臨，貞吉。", "九二：咸臨，吉无不利。", "六三：甘臨，无攸利。既憂之，无咎。", "六四：至臨，无咎。", "六五：知臨，大君之宜，吉。", "上六：敦臨，吉无咎。"], "yong": null}, {"n": 20, "sym": "䷓", "name": "觀", "upper": "巽", "lower": "坤", "bits": "000011", "guaci": "觀：盥而不薦，有孚顒若。", "yao": ["初六：童觀，小人无咎，君子吝。", "六二：窺觀，利女貞。", "六三：觀我生，進退。", "六四：觀國之光，利用賓于王。", "九五：觀我生，君子无咎。", "上九：觀其生，君子无咎。"], "yong": null}, {"n": 21, "sym": "䷔", "name": "噬嗑", "upper": "離", "lower": "震", "bits": "100101", "guaci": "噬嗑：亨。利用獄。", "yao": ["初九：屨校滅趾，无咎。", "六二：噬膚滅鼻，无咎。", "六三：噬昔（一作臘）肉，遇毒；小吝，无咎。", "九四：噬乾胏，得金矢，利艱貞，吉。", "六五：噬乾肉，得黃金，貞厲，无咎。", "上九：何校滅耳，凶。"], "yong": null}, {"n": 22, "sym": "䷕", "name": "賁", "upper": "艮", "lower": "離", "bits": "101001", "guaci": "賁：亨。小利有攸往。", "yao": ["初九：賁其趾，舍車而徒。", "六二：賁其須。", "九三：賁如濡如，永貞吉。", "六四：賁如皤如，白馬翰如，匪寇婚媾。", "六五：賁於丘園，束帛戔戔，吝，終吉。", "上九：白賁，无咎。"], "yong": null}, {"n": 23, "sym": "䷖", "name": "剝", "upper": "艮", "lower": "坤", "bits": "000001", "guaci": "剝：不利。有攸往。", "yao": ["初六：剝牀以足，蔑貞凶。", "六二：剝牀以辨，蔑貞凶。", "六三：剝之，无咎。", "六四：剝牀以膚，凶。", "六五：貫魚，以宮人寵，无不利。", "上九：碩果不食，君子德車（一作得輿），小人剝廬。"], "yong": null}, {"n": 24, "sym": "䷗", "name": "復", "upper": "坤", "lower": "震", "bits": "100000", "guaci": "復：亨。出入无疾，朋來无咎。反復其道，七日來復，利有攸往。", "yao": ["初九：不遠復，无祇悔，元吉。", "六二：休復，吉。", "六三：頻復，厲无咎。", "六四：中行獨復。", "六五：敦復，无悔。", "上六：迷復，凶，有災眚。用行師，終有大敗，以其國君，凶；至于十年，不克征。"], "yong": null}, {"n": 25, "sym": "䷘", "name": "无妄", "upper": "乾", "lower": "震", "bits": "100111", "guaci": "无妄：元亨。利貞。其匪正有眚，不利有攸往。", "yao": ["初九：无妄，往吉。", "六二：不耕穫，不菑畬，則利有攸往。", "六三：无妄之災，或繫之牛，行人之得，邑人之災。", "九四：可貞，无咎。", "九五：无妄之疾，勿藥有喜。", "上九：无妄，行有眚，无攸利。"], "yong": null}, {"n": 26, "sym": "䷙", "name": "大畜", "upper": "艮", "lower": "乾", "bits": "111001", "guaci": "大畜：利貞，不家食吉，利涉大川。", "yao": ["初九：有厲利已。", "九二：輿說輹（一作腹）。", "九三：良馬逐，利艱貞，吉。日閑輿衛，利有攸往。", "六四：童牛之告（一作牿），元吉。", "六五：豶豕之牙，吉。", "上九：何天之衢，亨。"], "yong": null}, {"n": 27, "sym": "䷚", "name": "頤", "upper": "艮", "lower": "震", "bits": "100001", "guaci": "頤：貞吉。觀頤，自求口實。", "yao": ["初九：舍爾靈龜，觀我朵頤，凶。", "六二：顛頤，拂經，于丘頤，征凶。", "六三：拂頤，貞凶，十年勿用，无攸利。", "六四：顛頤吉，虎視眈眈，其欲逐逐，无咎。", "六五：拂經，居貞吉，不可涉大川。", "上九：由頤，厲吉，利涉大川。"], "yong": null}, {"n": 28, "sym": "䷛", "name": "大過", "upper": "兌", "lower": "巽", "bits": "011110", "guaci": "大過：棟橈，利有攸往，亨。", "yao": ["初六：藉用白茅，无咎。", "九二：枯楊生稊，老夫得其女妻，无不利。", "九三：棟橈，凶。", "九四：棟隆，吉。有它吝。", "九五：枯楊生華，老婦得其士夫，无咎无譽。", "上六：過涉滅頂，凶，无咎。"], "yong": null}, {"n": 29, "sym": "䷜", "name": "坎", "upper": "坎", "lower": "坎", "bits": "010010", "guaci": "習坎：有孚，維心亨。行有尚。", "yao": ["初六：習坎，入于坎窞，凶。", "九二：坎有險，求小得。", "六三：來之坎坎，險且枕，入于坎窞，勿用。", "六四：尊酒簋，貳用缶。内約自牖（一作樽酒簋貳，用缶，納約自牖），終无咎。", "九五：坎不盈，禔（一作祗）既平，无咎。", "上六：係用徽纆，寘于叢棘，三歲不得，凶。"], "yong": null}, {"n": 30, "sym": "䷝", "name": "離", "upper": "離", "lower": "離", "bits": "101101", "guaci": "離：利貞。亨。畜牝牛，吉。", "yao": ["初九：履錯然，敬之无咎。", "六二：黃離，元吉。", "九三：日昃之離，不鼓缶而歌，則大耋之差（一作嗟），凶。", "九四：突如其來如，焚如，死如，棄如。", "六五：出涕沱若，戚嗟若，吉。", "上九：王用出征，有嘉折首，獲匪其醜，无咎。"], "yong": null}, {"n": 31, "sym": "䷞", "name": "咸", "upper": "兌", "lower": "艮", "bits": "001110", "guaci": "咸：亨。利貞。取女吉。", "yao": ["初六：咸其拇（一作母）。", "六二：咸其腓，凶，居吉。", "九三：咸其股，執其隨，往吝。", "九四：貞吉悔亡，憧憧往來，朋從爾思。", "九五：咸其脢，无悔。", "上六：咸其輔，頰，舌。"], "yong": null}, {"n": 32, "sym": "䷟", "name": "恆", "upper": "震", "lower": "巽", "bits": "011100", "guaci": "恆：亨，无咎。利貞，利有攸往。", "yao": ["初六：浚恆，貞凶，无攸利。", "九二：悔亡。", "九三：不恆其德，或承之羞，貞吝。", "九四：田无禽。", "六五：恆其德，貞，婦人吉，夫子凶。", "上六：震（一作振）恆，凶。"], "yong": null}, {"n": 33, "sym": "䷠", "name": "遯", "upper": "乾", "lower": "艮", "bits": "001111", "guaci": "遯：亨。小利貞。", "yao": ["初六：遯尾，厲，勿用有攸往。", "六二：執之用黃牛之革，莫之勝說。", "九三：係遯，有疾厲，畜臣妾吉。", "九四：好遯君子吉，小人否。", "九五：嘉遯，貞吉。", "上九：肥遯，无不利。"], "yong": null}, {"n": 34, "sym": "䷡", "name": "大壯", "upper": "震", "lower": "乾", "bits": "111100", "guaci": "大壯：利貞。", "yao": ["初九：壯于趾，征凶，有孚。", "九二：貞吉。", "九三：小人用壯，君子用罔，貞厲。羝羊觸藩，羸其角。", "九四：貞吉悔亡，藩決不羸，壯于大轝（一作輿）之腹（一作輹）。", "六五：喪羊于易，无悔。", "上六：羝羊觸藩，不能退，不能遂，无攸利，艱則吉。"], "yong": null}, {"n": 35, "sym": "䷢", "name": "晉", "upper": "離", "lower": "坤", "bits": "000101", "guaci": "晉：康侯用錫馬蕃庶，晝日三接。", "yao": ["初六：晉如，摧如，貞吉。罔孚，裕无咎。", "六二：晉如，愁如，貞吉。受茲介福，于其王母。", "六三：眾允，悔亡。", "九四：晉如鼫（一作碩）鼠，貞厲。", "六五：悔亡，矢（一作失）得勿恤，往吉无不利。", "上九：晉其角，維用伐邑，厲吉无咎，貞吝。"], "yong": null}, {"n": 36, "sym": "䷣", "name": "明夷", "upper": "坤", "lower": "離", "bits": "101000", "guaci": "明夷：利艱貞。", "yao": ["初九：明夷于飛，垂其翼。君子于行，三日不食，有攸往，主人有言。", "六二：明夷，夷于左股，用拯馬壯，吉。", "九三：明夷于南狩，得其大首，不可疾貞。", "六四：入于左腹，獲明夷之心，于出門庭。", "六五：箕子之明夷，利貞。", "上六：不明晦，初登于天，後入于地。"], "yong": null}, {"n": 37, "sym": "䷤", "name": "家人", "upper": "巽", "lower": "離", "bits": "101011", "guaci": "家人：利女貞。", "yao": ["初九：閑有家，悔亡。", "六二：无攸遂，在中饋，貞吉。", "九三：家人嗃嗃，悔厲吉；婦子嘻嘻，終吝。", "六四：富家，大吉。", "九五：王假有家，勿恤。吉。", "上九：有孚威如，終吉。"], "yong": null}, {"n": 38, "sym": "䷥", "name": "睽", "upper": "離", "lower": "兌", "bits": "110101", "guaci": "睽：小事吉。", "yao": ["初九：悔亡，喪馬勿逐，自復；見惡人无咎。", "九二：遇主于巷，无咎。", "六三：見輿曳，其牛𧤊（一作掣），其人天且劓，无初有終。", "九四：睽孤，遇元夫，交孚，厲无咎。", "六五：悔亡，厥宗噬膚，往何咎。", "上九：睽孤， 見豕負涂，載鬼一車， 先張之弧，後說之弧，匪寇婚媾，往遇雨則吉。"], "yong": null}, {"n": 39, "sym": "䷦", "name": "蹇", "upper": "坎", "lower": "艮", "bits": "001010", "guaci": "蹇：利西南，不利東北；利見大人，貞吉。", "yao": ["初六：往蹇，來譽。", "六二：王臣蹇蹇，匪躬之故。", "九三：往蹇來反。", "六四：往蹇來連。", "九五：大蹇朋來。", "上六：往蹇來碩，吉；利見大人。"], "yong": null}, {"n": 40, "sym": "䷧", "name": "解", "upper": "震", "lower": "坎", "bits": "010100", "guaci": "解：利西南，无所往，其來復吉。有攸往，夙吉。", "yao": ["初六：无咎。", "九二：田獲三狐，得黃矢，貞吉。", "六三：負且乘，致寇至，貞吝。", "九四：解而拇，朋至斯孚。", "六五：君子惟（一作維）有解，吉；有孚于小人。", "上六：公用射隼，于高墉（一作庸）之上，獲之，无不利。"], "yong": null}, {"n": 41, "sym": "䷨", "name": "損", "upper": "艮", "lower": "兌", "bits": "110001", "guaci": "損：有孚，元吉。无咎，可貞，利有攸往。曷之用？二簋可用享。", "yao": ["初九：祀（一作已）事遄往，无咎，酌損之。", "九二：利貞，征凶，弗損益之。", "六三：三人行，則損一人；一人行，則得其友。", "六四：損其疾，使遄有喜，无咎。", "六五：或益之，十朋之龜弗克違，元吉。", "上九：弗損益之，无咎，貞吉，利有攸往，得臣无家。"], "yong": null}, {"n": 42, "sym": "䷩", "name": "益", "upper": "巽", "lower": "震", "bits": "100011", "guaci": "益：利有攸往。利涉大川。", "yao": ["初九：利用為大作，元吉，无咎。", "六二：或益之，十朋之龜弗克違，永貞吉。王用享于帝，吉。", "六三：益之用凶事，无咎。有孚中行，告公用圭。", "六四：中行，告公從。利用為依遷國（一作邦）。", "九五：有孚惠心，勿問元吉。有孚惠我德。", "上九：莫益之，或擊之，立心勿恆，凶。"], "yong": null}, {"n": 43, "sym": "䷪", "name": "夬", "upper": "兌", "lower": "乾", "bits": "111110", "guaci": "夬：揚于王庭，孚號，有厲，告自邑，不利即戎，利有攸往。", "yao": ["初九：壯于前趾，往不勝為咎。", "九二：惕號，莫夜有戎，勿恤。", "九三：壯于頄，有凶。君子夬夬，獨行遇雨，若濡有慍，无咎。", "九四：臀无膚，其行次且。牽羊悔亡，聞言不信。", "九五：莧陸夬夬，中行无咎。", "上六：无號，終有凶。"], "yong": null}, {"n": 44, "sym": "䷫", "name": "姤", "upper": "乾", "lower": "巽", "bits": "011111", "guaci": "姤：女壯，勿用取女。", "yao": ["初六：系于金柅，貞吉，有攸往，見凶，羸豕，孚，蹢躅（一作𨅙𨄃）。", "九二：包有魚，无咎，不利賓。", "九三：臀无膚，其行次且，厲，无大咎。", "九四：包无魚，起凶。", "九五：以杞包（一作苞）瓜，含章，有隕自天。", "上九：姤其角，吝，无咎。"], "yong": null}, {"n": 45, "sym": "䷬", "name": "萃", "upper": "兌", "lower": "坤", "bits": "000110", "guaci": "萃：王假有廟，利見大人，亨。利貞。用大牲吉，利有攸往。", "yao": ["初六：有孚不終，乃亂乃萃，若號一握為笑，勿恤，往无咎。", "六二：引吉，无咎，孚乃利用禴。", "六三：萃如，嗟如，无攸利，往无咎，小吝。", "九四：大吉，无咎。", "九五：萃有位，无咎。匪孚，元永貞，悔亡。", "上六：齎資（一作咨）涕洟，无咎。"], "yong": null}, {"n": 46, "sym": "䷭", "name": "升", "upper": "坤", "lower": "巽", "bits": "011000", "guaci": "升：元亨，用見大人，勿恤，南征吉。", "yao": ["初六：允升，大吉。", "九二：孚乃利用禴，无咎。", "九三：升虛邑。", "六四：王用享（一作亨）于岐山，吉无咎。", "六五：貞吉，升階。", "上六：冥升，利于不息之貞。"], "yong": null}, {"n": 47, "sym": "䷮", "name": "困", "upper": "兌", "lower": "坎", "bits": "010110", "guaci": "困：亨，貞大人吉，无咎，有言不信。", "yao": ["初六：臀困于株木，入于幽谷，三歲不覿。", "九二：困于酒食，朱紱方來，利用亨祀，征凶，无咎。", "六三：困于石，據于蒺蔾（一作藜），入于其宮，不見其妻，凶。", "九四：來荼荼（一作徐徐），困于金轝（一作車），吝，有終。", "九五：劓刖，困于赤紱，乃徐有說，利用祭祀。", "上六：困于葛藟，于臲卼，曰動悔。有悔，征吉。"], "yong": null}, {"n": 48, "sym": "䷯", "name": "井", "upper": "坎", "lower": "巽", "bits": "011010", "guaci": "井：改邑不改井，无喪无得，往來井井。汔至亦未繘井。羸其瓶，凶。", "yao": ["初六：井泥不食，舊井无禽。", "九二：井谷射鮒，瓮敝漏。", "九三：井渫不食，為我心惻，可用汲，王明，並受其福。", "六四：井甃，无咎。", "九五：井冽，寒泉食。", "上六：井收勿幕，有孚元吉。"], "yong": null}, {"n": 49, "sym": "䷰", "name": "革", "upper": "兌", "lower": "離", "bits": "101110", "guaci": "革：已日乃孚，元亨。利貞。悔亡。", "yao": ["初九：鞏用黃牛之革。", "六二：已日乃革之，征吉，无咎。", "九三：征凶，貞厲，革言三就，有孚。", "九四：悔亡，有孚改命，吉。", "九五：大人虎變，未占有孚。", "上六：君子豹變，小人革面，征凶，居貞吉。"], "yong": null}, {"n": 50, "sym": "䷱", "name": "鼎", "upper": "離", "lower": "巽", "bits": "011101", "guaci": "鼎：元吉，亨。", "yao": ["初六：鼎顛趾，利出否，得妾以其子，无咎。", "九二：鼎有實，我仇有疾，不我能即，吉。", "九三：鼎耳革，其行塞，雉膏不食，方雨虧悔，終吉。", "九四：鼎折足，覆公餗，其刑（一作形）渥，凶。", "六五：鼎黃耳金鉉，利貞。", "上九：鼎玉鉉，大吉，无不利。"], "yong": null}, {"n": 51, "sym": "䷲", "name": "震", "upper": "震", "lower": "震", "bits": "100100", "guaci": "震：亨。震來虩虩，笑言啞啞。震驚百里，不喪匕鬯。", "yao": ["初九：震來虩虩，後笑言啞啞，吉。", "六二：震來厲，億喪貝，躋于九陵，勿逐，七日得。", "六三：震蘇蘇，震行无眚。", "九四：震遂泥。", "六五：震往來厲，億无喪，有事。", "上六：震索索，視矍矍，征凶。震不于其躬，于其鄰，无咎。婚媾有言。"], "yong": null}, {"n": 52, "sym": "䷳", "name": "艮", "upper": "艮", "lower": "艮", "bits": "001001", "guaci": "艮：艮其背，不獲其身，行其庭，不見其人，无咎。", "yao": ["初六：艮其趾，无咎，利永貞。", "六二：艮其腓，不拯其隨，其心不快。", "九三：艮其限，裂（一作列）其夤，厲閽（一作薰）心。", "六四：艮其身，无咎。", "六五：艮其輔，言有孚（一作序），悔亡。", "上九：敦艮，吉。"], "yong": null}, {"n": 53, "sym": "䷴", "name": "漸", "upper": "巽", "lower": "艮", "bits": "001011", "guaci": "漸：女歸吉，利貞。", "yao": ["初六：鴻漸于干，小子厲，有言，无咎。", "六二：鴻漸于磐，飲食衎衎，吉。", "九三：鴻漸于陸，夫征不復，婦孕不育，凶；利禦寇。", "六四：鴻漸于木，或得其桷，无咎。", "九五：鴻漸于陵，婦三歲不孕，終莫之勝，吉。", "上九：鴻漸于陸，其羽可用為儀，吉。"], "yong": null}, {"n": 54, "sym": "䷵", "name": "歸妹", "upper": "震", "lower": "兌", "bits": "110100", "guaci": "歸妹：征凶，无攸利。", "yao": ["初九：歸妹以娣，跛能履，征吉。", "九二：眇能（一作而）視，利幽人之貞。", "六三：歸妹以須，反歸以娣。", "九四：歸妹愆期，遲歸有時。", "六五：帝乙歸妹，其君之袂，不如其娣之袂良，月幾望，吉。", "上六：女承筐无實，士刲羊无血，无攸利。"], "yong": null}, {"n": 55, "sym": "䷶", "name": "豐", "upper": "震", "lower": "離", "bits": "101100", "guaci": "豐：亨。王假之，勿憂，宜日中。", "yao": ["初九：遇其配主，雖旬无咎，往有尚。", "六二：豐其蔀，日中見斗，往得疑疾，有孚發若，吉。", "九三：豐其沛，日中見沬，折其右肱，无咎。", "九四：豐其蔀，日中見斗，遇其夷主，吉。", "六五：來章，有慶譽，吉。", "上六：豐其屋，蔀其家，窺其戶，闃其无人，三歲不觌，凶。"], "yong": null}, {"n": 56, "sym": "䷷", "name": "旅", "upper": "離", "lower": "艮", "bits": "001101", "guaci": "旅：小亨，旅貞吉。", "yao": ["初六：旅瑣瑣，斯其所取災。", "六二：旅即次，懷其資，得僮（一作童）僕貞。", "九三：旅焚其次，喪其僮（一作童）僕，貞厲。", "九四：旅于處，得其資斧，我心不快。", "六五：射雉一矢亡，終以譽命。", "上九：鳥焚其巢，旅人先笑後號咷。喪牛于易，凶。"], "yong": null}, {"n": 57, "sym": "䷸", "name": "巽", "upper": "巽", "lower": "巽", "bits": "011011", "guaci": "巽：小亨。利有攸往。利見大人。", "yao": ["初六：進退，利武人之貞。", "九二：巽在牀下，用史巫紛若，吉无咎。", "九三：頻巽，吝。", "六四：悔亡，田獲三品。", "九五：貞吉悔亡，无不利。无初有終，先庚三日，後庚三日，吉。", "上九：巽在牀下，喪其資斧，貞凶。"], "yong": null}, {"n": 58, "sym": "䷹", "name": "兌", "upper": "兌", "lower": "兌", "bits": "110110", "guaci": "兌：亨。利貞。", "yao": ["初九：和兌，吉。", "九二：孚兌，吉，悔亡。", "六三：來兌，凶。", "九四：商兌，未寧，介疾有喜。", "九五：孚于剝，有厲。", "上六：引兌。"], "yong": null}, {"n": 59, "sym": "䷺", "name": "渙", "upper": "巽", "lower": "坎", "bits": "010011", "guaci": "渙：亨，王假有廟，利涉大川，利貞。", "yao": ["初六：用拯馬壯，吉，悔亡。", "九二：渙奔其机，悔亡。", "六三：渙其躬，无悔。", "六四：渙其群，元吉。渙有丘，匪夷所思。", "九五：渙汗其大號，渙王居，无咎。", "上九：渙其血，去逖出，无咎。"], "yong": null}, {"n": 60, "sym": "䷻", "name": "節", "upper": "坎", "lower": "兌", "bits": "110010", "guaci": "節：亨。苦節不可貞。", "yao": ["初九：不出戶庭，无咎。", "九二：不出門庭，凶。", "六三：不節若，則嗟若，无咎。", "六四：安節，亨。", "九五：甘節，吉；往有尚。", "上六：苦節，貞凶，悔亡。"], "yong": null}, {"n": 61, "sym": "䷼", "name": "中孚", "upper": "巽", "lower": "兌", "bits": "110011", "guaci": "中孚：豚魚吉，利涉大川，利貞。", "yao": ["初九：虞吉，有它（一作他）不燕。", "九二：鳴鶴在陰，其子和之，我有好爵，吾與爾靡之。", "六三：得敵，或鼓或罷，或泣或歌。", "六四：月既（一作几、幾）望，馬匹亡，无咎。", "九五：有孚攣如，无咎。", "上九：翰音登于天，貞凶。"], "yong": null}, {"n": 62, "sym": "䷽", "name": "小過", "upper": "震", "lower": "艮", "bits": "001100", "guaci": "小過：亨。利貞。可小事，不可大事。飛鳥遺之音，不宜上宜下，大吉。", "yao": ["初六：飛鳥以凶。", "六二：過其祖，遇其妣；不及其君，遇其臣；无咎。", "九三：弗過防之，從或戕之，凶。", "九四：无咎，弗過遇之。往厲必戒，勿用永貞。", "六五：密雲不雨，自我西郊，公弋取彼在穴。", "上六：弗遇過之，飛鳥離之，凶，是謂災眚。"], "yong": null}, {"n": 63, "sym": "䷾", "name": "既濟", "upper": "坎", "lower": "離", "bits": "101010", "guaci": "既濟：亨小。利貞。初吉終亂。", "yao": ["初九：曳其輪，濡其尾，无咎。", "六二：婦喪其茀，勿逐，七日得。", "九三：高宗伐鬼方，三年克之，小人勿用。", "六四：繻有衣袽，終日戒。", "九五：東鄰殺牛，不如西鄰之禴祭，實受其福。", "上六：濡其首，厲。"], "yong": null}, {"n": 64, "sym": "䷿", "name": "未濟", "upper": "離", "lower": "坎", "bits": "010101", "guaci": "未濟：亨。小狐汔濟，濡其尾，无攸利。", "yao": ["初六：濡 <script type="application/json" id="liuyao-rules-zs">{"Z01":{"title":"用神·父母爻（舟车、宅舍、文书）","type":"Y","q":[{"b":"增","l":810,"t":"占天地、城池、墙垣、宅舍、屋宇、舟车、衣服、雨具、绸缎、布匹、杂货、及章奏、文书、文章、书馆、文契，亦以父母爻为用神。","ch":"用神章"}],"use":"买车、买房、证件合同类，以父母为主用神。"},"Z02":{"title":"用神·官鬼爻","type":"Y","q":[{"b":"增","l":811,"t":"占功名、官府、雷霆、鬼神、妻占夫，皆以官鬼爻为用神。","ch":"用神章"},{"b":"增","l":811,"t":"一切拘束我身者是也。","ch":"用神章"}],"use":"功名、官府；女占夫/男方以官鬼。“工作/上班”取官鬼属程序类推（见 P08）。"},"Z03":{"title":"用神·兄弟爻（劫财、阻隔）","type":"Y","q":[{"b":"增","l":812,"t":"兄弟乃同类之人，彼得志则欺陵，见财则夺，所以占财物，以此为劫财之神，占谋事，以此为阻隔之神","ch":"用神章"}],"use":"占财物、谋事时，兄弟发动列为“阻隔/劫财之象”，仍须看其旺衰与受制。"},"Z04":{"title":"用神·妻财爻","type":"Y","q":[{"b":"增","l":813,"t":"占妻妾、婢仆、下役，凡我驱使之人，皆以财爻为用神。占货财、珠宝、金银、仓库、钱粮，一切使用之财物、什物、器皿，亦以财爻为用神。","ch":"用神章"}],"use":"钱款资金、妻妾以妻财为用。"},"Z05":{"title":"用神·子孙爻","type":"Y","q":[{"b":"增","l":814,"t":"占子孙、占女、女婿、侄、甥、门徒，凡在我子孙辈中，皆以子孙爻为用神。占忠臣、良将、医士、医药、僧、道、兵、卒，皆以子孙爻为用神。","ch":"用神章"}],"use":""},"Z06":{"title":"自占用世、占他人用应","type":"Y","q":[{"b":"增","l":640,"t":"自占吉凶者，以世爻为用神","ch":"八宫章"},{"b":"增","l":658,"t":"占他人者，以应爻为用神。","ch":"八宫章"}],"use":"问自己之事取世；无亲属称呼之他人取应。"},"Z07":{"title":"亲人看所用用神，疏者用应","type":"Y","q":[{"b":"增","l":7041,"t":"占亲人，看所用用神；疏者，以应爻为用神。","ch":"行人章"}],"use":"问别人时按真实关系取六亲，不一律取应。"},"Z08":{"title":"男占女以财、女占男以官","type":"H","q":[{"b":"增","l":6701,"t":"觉子曰：男家占女，以财为用；女家占男，以官为用","ch":"婚姻章"}],"use":"感情/婚姻类，男占女取妻财，女占男取官鬼（编订者按语，非野鹤正文）。"},"Z09":{"title":"元神、忌神、仇神","type":"Y","q":[{"b":"增","l":821,"t":"元神者，生用神之爻，即为元神。忌神者，克用神之爻也，即为忌神。","ch":"用神、元神、忌神、仇神章"},{"b":"增","l":821,"t":"仇神者，克制元神不能生用神，反生忌神而克害用神，即为仇神。","ch":"用神、元神、忌神、仇神章"}],"use":"按主用神五行自动推出原/忌/仇。"},"Z10":{"title":"先看用神，再看元神忌神","type":"Y","q":[{"b":"增","l":822,"t":"不拘占何事，先看何爻为用神。既得用神，须看旺相否？有元神动而生扶否？有忌神动而克害否？","ch":"用神、元神、忌神、仇神章"}],"use":"判断辅助顺序第一步“定用神”，第四步“原忌仇”。"},"Z11":{"title":"用神两现·俱静择旺、一动择动","type":"Y","q":[{"b":"增","l":657,"t":"若两爻俱动，或俱不动，择其旺者为用神。倘一爻动者，择其动者为用神。","ch":"八宫章"}],"use":"两现时先按此条取舍。"},"Z12":{"title":"用神两现·野鹤取空破","type":"Y","q":[{"b":"增","l":2832,"t":"按古法，舍其休囚而用旺相，舍其静爻而用动爻","ch":"两现章"},{"b":"增","l":2832,"t":"然余得验者，多有应乎旬空月破，故常舍其不空而用旬空，舍其不破而用月破。","ch":"两现章"}],"use":"两现中一爻空/破者，以空/破者为主（野鹤说），并注明古法相反。"},"Z13":{"title":"用神不现·先日月后伏神","type":"Y","q":[{"b":"增","l":2231,"t":"凡卦，用神不现者，即以日月为用神。倘日月非用神，须于本宫首卦寻之。","ch":"飞伏神章"},{"b":"增","l":1164,"t":"卦无用神，即以月建为用神，不必寻取伏神。","ch":"月将章"}],"use":""},"Z14":{"title":"四时旺相·按月逐一","type":"Y","q":[{"b":"增","l":1147,"t":"九月建戌，戌土旺，丑未之土次之。土生金，金为相，其余木、火、水，俱作休囚。","ch":"四时旺相章"},{"b":"增","l":1151,"t":"十二月建丑，丑土旺，辰戌之土次之。土生金，金为相，水虽衰，犹有余气。","ch":"四时旺相章"}],"use":"旺/次旺/相/余气/休囚按各月原文表。"},"Z15":{"title":"“旺”的广义","type":"Y","q":[{"b":"增","l":2110,"t":"用神宜旺：不可指定旺于四时，但得用临日月，或遇日月动爻变爻生扶，或用爻遇长生、逢帝旺，皆谓之旺。","ch":"各门类题头总注章"}],"use":"旺衰不只看月令，一并列日月动变生扶。"},"Z16":{"title":"月建为纲领","type":"Y","q":[{"b":"增","l":1161,"t":"月建乃当权之主帅，万卜以之为纲领。","ch":"月将章"},{"b":"增","l":1161,"t":"卦有变爻克制动爻者，月建能制服变爻；卦有动爻克制静爻者，月建亦能制服动爻","ch":"月将章"}],"use":"第二步先看月建对动爻、变爻的生克。"},"Z17":{"title":"爻值月建逢空（书中两说）","type":"Y","q":[{"b":"增","l":1166,"t":"爻值月建，旺相当权，逢空不空，逢伤无害。","ch":"月将章"},{"b":"增","l":1167,"t":"古有此说，余试不然，在旬内者，毕竟为空。","ch":"月将章"}],"use":"临月建而旬空者，按野鹤“毕竟为空”标注，不说“不空”。"},"Z18":{"title":"日月能制动静飞伏变，诸爻不能伤日月","type":"Y","q":[{"b":"增","l":1129,"t":"日月如天，能生克动爻、静爻、飞爻、伏爻、变爻，而诸爻皆不能伤日月。","ch":"动变生克冲合章"}],"use":""},"Z19":{"title":"日冲静爻：旺相暗动、衰弱日破","type":"Y","q":[{"b":"增","l":1273,"t":"冲旺相之静爻，即为暗动，冲衰弱之静爻，则为日破。","ch":"日辰章"},{"b":"增","l":1745,"t":"静爻休囚，日辰冲之，为日破；静爻旺相，日辰冲之，为暗动。","ch":"暗动章"}],"use":"同一静爻只给“暗动”或“日破”之一，不并列。旺相按月令（旺/次旺/相）或得月生扶判定。"},"Z20":{"title":"冲空则实、合处逢冲","type":"Y","q":[{"b":"增","l":1275,"t":"冲空即起，冲合即开。","ch":"日辰章"},{"b":"增","l":1276,"t":"爻遇旬空，日辰冲起而为用，谓之冲空则实","ch":"日辰章"}],"use":"旬空静爻逢日冲，标“冲空则实（冲起）”，不标日破/暗动。"},"Z21":{"title":"日冲动爻：旺愈动、衰则散","type":"Y","q":[{"b":"增","l":1280,"t":"爻旺而动，冲之愈动，爻衰而动，冲之则散。","ch":"日辰章"}],"use":""},"Z22":{"title":"爻临日建","type":"Y","q":[{"b":"增","l":1283,"t":"爻临日建，月冲不破，月克无伤，逢动爻之克，亦不为害，化回头之克，亦不为殃。","ch":"日辰章"}],"use":""},"Z23":{"title":"动克静，静不克动","type":"Y","q":[{"b":"增","l":1098,"t":"卦有动爻，能克静爻，即使静爻旺相，亦不能克动爻","ch":"动静生克章"}],"use":""},"Z24":{"title":"变爻只生克本位动爻","type":"Y","q":[{"b":"增","l":1117,"t":"夫变出之爻，能生克冲合本位之动爻，不能生克他爻，而他爻与本位之动爻，亦不能生克变爻。","ch":"动变生克冲合章"}],"use":"回头生克、化进退、化空破只与本位动爻比较。"},"Z25":{"title":"化吉、化凶","type":"Y","q":[{"b":"增","l":2111,"t":"用神化吉：凡用神元神，动化回头生、化长生、化帝旺、化比助、化日月，皆为化吉。","ch":"各门类题头总注章"},{"b":"增","l":2112,"t":"用神化凶：凡用神元神，动化回头克、化绝、化墓、化空、化鬼、化退神，皆为化凶。","ch":"各门类题头总注章"}],"use":"只对用神、元神称“化吉/化凶之象”；忌神化克见 Z29。"},"Z26":{"title":"回头克","type":"Y","q":[{"b":"增","l":3292,"t":"爻动而化克者，如金爻动，变火克金，木爻动，变金克木，谓之回头克我也。","ch":"增删《黄金策·千金赋》（上）"}],"use":""},"Z27":{"title":"进神退神","type":"Y","q":[{"b":"增","l":2400,"t":"进退神者，爻之动而化也，化进化退，吉凶祸福，有喜忌之分。所喜者，宜化进神；所忌者，宜化退神。","ch":"进神退神章"}],"use":""},"Z28":{"title":"动散：旺相有气冲之不散","type":"Y","q":[{"b":"增","l":1768,"t":"旺相者，冲之不散；有气者，冲之不散；休囚者，间有冲散，亦千百中之一二耳。","ch":"动散章"}],"use":""},"Z29":{"title":"忌神无力诸条","type":"Y","q":[{"b":"增","l":921,"t":"忌神静，临空破，二也。","ch":"元神、忌神、衰旺章"},{"b":"增","l":929,"t":"忌神动，化绝、化克、化破、化散，六也。","ch":"元神、忌神、衰旺章"}],"use":""},"Z30":{"title":"元神有力（含临空化空）","type":"Y","q":[{"b":"增","l":864,"t":"元神旺相，或临日月，或得日月动爻生扶者，一也。","ch":"元神、忌神、衰旺章"},{"b":"增","l":868,"t":"元神旺动，临空、化空，五也。","ch":"元神、忌神、衰旺章"}],"use":""},"Z31":{"title":"动不为空（按语）","type":"H","q":[{"b":"增","l":871,"t":"按：古以临空、化空为无用，非也。殊不知动不为空，待冲空、实空之日，而为有用。","ch":"元神、忌神、衰旺章"}],"use":""},"Z32":{"title":"用神无根则元忌皆难论","type":"H","q":[{"b":"增","l":935,"t":"倘若用神无根，谓之元神有力亦难生，忌神无力亦休喜。","ch":"元神、忌神、衰旺章"}],"use":""},"Z33":{"title":"暗动有喜有忌","type":"Y","q":[{"b":"增","l":1747,"t":"暗动者，有喜有忌。用神休囚，得元神暗动以相生","ch":"暗动章"},{"b":"增","l":1747,"t":"用神休囚无助，若遇忌神暗动，克害用神者，则谓之忌。","ch":"暗动章"}],"use":""},"Z34":{"title":"旬空诸条","type":"Y","q":[{"b":"增","l":1984,"t":"野鹤曰：旺不为空，动不为空，动而化空，伏而旺相，皆不为空，有日建动爻生扶者，亦不为空。月破为空，有气不动亦为空，伏而被克亦为空，真空为空。","ch":"旬空章"}],"use":"动空、化空不作“空”断；静而旺相是否为空书中两句（“旺不为空”“有气不动亦为空”）并存，程序标“空（存疑）”。"},"Z35":{"title":"旬空可再占","type":"Y","q":[{"b":"增","l":1985,"t":"凡遇旬空，命之再占，卦吉者，许之出旬而不空；卦凶者，许之空矣。","ch":"旬空章"}],"use":""},"Z36":{"title":"月破","type":"Y","q":[{"b":"增","l":2165,"t":"动则能伤于爻，变则能伤于动","ch":"月破章"},{"b":"增","l":2165,"t":"目下虽破，出月则不破。今日虽破，实破之日则不破，逢合之日则不破","ch":"月破章"},{"b":"增","l":2165,"t":"惟静而不动，又无日辰动爻生助，实则到底而破矣。","ch":"月破章"}],"use":""},"Z37":{"title":"飞伏·姤卦妻财伏亥下（书中原例）","type":"Y","q":[{"b":"增","l":2242,"t":"此姤卦，系乾宫之卦，以寅卯木爻为妻财，今六爻并无寅卯，即是用神不上卦。","ch":"飞伏神章"},{"b":"增","l":2243,"t":"乾卦寅木妻财在二爻，即以此寅木妻财伏于姤卦亥水之下，姤卦二爻之亥水为飞神，寅木即为伏神，亥水而生寅木，谓之“飞来生伏得长生”。","ch":"飞伏神章"}],"use":"飞神生伏标“飞来生伏”。书中下句“便作吉断”，程序不照搬为结论，只列为支持条件。"},"Z38":{"title":"伏神有用六条","type":"Y","q":[{"b":"增","l":2259,"t":"伏神得日月生者，一也。","ch":"飞伏神章"},{"b":"增","l":2260,"t":"伏神旺相者，二也。","ch":"飞伏神章"},{"b":"增","l":2261,"t":"伏神得飞神生者，三也。","ch":"飞伏神章"},{"b":"增","l":2262,"t":"伏神得动爻生者，四也。","ch":"飞伏神章"},{"b":"增","l":2263,"t":"伏神得遇日月动爻冲克飞神者，五也。","ch":"飞伏神章"},{"b":"增","l":2264,"t":"伏神得遇飞神空破休囚墓绝者，六也。","ch":"飞伏神章"}],"use":""},"Z39":{"title":"伏神终不得出五条","type":"Y","q":[{"b":"增","l":2269,"t":"伏神休囚无气者，一也。","ch":"飞伏神章"},{"b":"增","l":2270,"t":"伏神被日月冲克者，二也。","ch":"飞伏神章"},{"b":"增","l":2271,"t":"伏神被旺相之飞神克害者，三也。","ch":"飞伏神章"},{"b":"增","l":2272,"t":"伏神墓绝于日月飞爻者，四也。","ch":"飞伏神章"},{"b":"增","l":2273,"t":"伏神休囚，值旬空月破者，五也。","ch":"飞伏神章"}],"use":""},"Z40":{"title":"飞神破墓衰空则伏神易出","type":"Y","q":[{"b":"增","l":2266,"t":"但得飞神临破、临绝、休囚、入墓，而伏神皆易出也。","ch":"飞伏神章"}],"use":""},"Z41":{"title":"四种合","type":"Y","q":[{"b":"增","l":1396,"t":"静而逢合，谓之合起；动而逢合，谓之合绊；爻与爻合，谓之合好；爻动化合，谓之化扶。","ch":"六合章"},{"b":"增","l":1398,"t":"然必用神有气相宜，用若失陷无济。","ch":"六合章"}],"use":""},"Z42":{"title":"三合成局条件","type":"Y","q":[{"b":"增","l":1482,"t":"一卦之内，有三爻动而合局者，一也。","ch":"三合章"},{"b":"增","l":1483,"t":"两爻动，一爻不动，亦成合局者，二也。","ch":"三合章"},{"b":"增","l":1484,"t":"有内卦初爻、三爻动，动而变出之爻成三合者，三也。","ch":"三合章"},{"b":"增","l":1485,"t":"有外卦四爻、六爻动，动而变出之爻成三合者，四也。","ch":"三合章"},{"b":"增","l":1498,"t":"三爻若只两爻动，不为成局。须待后来之月日补凑，合成其局，谓之虚一待用。一爻明动，一爻暗动，亦作两爻动。","ch":"三合章"},{"b":"增","l":1499,"t":"三合局中，有一值空破者，待填实之日月成之。","ch":"三合章"},{"b":"增","l":1496,"t":"至于日建月建，但有一在局中，谓之局旺，更吉。","ch":"三合章"},{"b":"增","l":1549,"t":"午火明动，戌爻暗动，三合而少寅字，借月建以成三合，本月必选。","ch":"三合章"},{"b":"增","l":1495,"t":"尤要世爻在局为美。","ch":"三合章"}],"use":"（V5.0 改严）只认四种结构——①三支俱由动爻（明动或暗动）构成；②两爻动、第三支为卦中静爻（条文 L1483 认可，但乾之需、乾之小畜、萃之否三例与之相左，程序标“成局存疑”并列入矛盾）；③内卦初、三爻俱动，第三支由其中一爻变出；④外卦四、上爻俱动，第三支由其中一爻变出。两爻动而第三支为月建者按 L1549 例成局；第三支为日辰者比照月建（程序归纳）。两爻动而第三支卦中、日月皆无，标“虚一待用”。动爻不足两支，不论三合。其他位置的变爻不得拼入三合。"},"Z43":{"title":"六冲须兼用神","type":"Y","q":[{"b":"增","l":1584,"t":"冲者，散也。凡占凶事，宜于冲散；占吉事，则不宜。亦必兼用神而言，用神若旺，虽冲不碍；用神失陷，凶而又凶。","ch":"六冲章"}],"use":""},"Z44":{"title":"间爻发动不可概以阻隔断","type":"Y","q":[{"b":"增","l":3361,"t":"野鹤曰：世为己，应为人，彼此欲相亲者，若遇间爻发动，不可概以阻隔断之，若得动而生合世应，反得此辈之力。","ch":"增删《黄金策·千金赋》（下）"},{"b":"增","l":3361,"t":"独忌克乎世应，事必难成。","ch":"增删《黄金策·千金赋》（下）"}],"use":""},"Z45":{"title":"间爻所象（买卖为牙行）","type":"H","q":[{"b":"增","l":3360,"t":"惟彼此两家之事，始可用之。如婚姻，以之为媒妁；词讼，以之为中说；买卖，以之为牙行","ch":"增删《黄金策·千金赋》（下）"}],"use":""},"Z46":{"title":"应期总注（节）","type":"Y","q":[{"b":"增","l":2127,"t":"静而逢值、逢冲：且如主事爻临子水不动，后逢子日、午日应之。","ch":"各门类应期总注章"},{"b":"增","l":2128,"t":"动而逢合逢值：且如主事爻临子水发动，后遇子日丑日应之。","ch":"各门类应期总注章"},{"b":"增","l":2133,"t":"月破喜逢填合","ch":"各门类应期总注章"},{"b":"增","l":2134,"t":"旬空最爱填冲","ch":"各门类应期总注章"}],"use":"只列“候选日”，一律标“程序归纳推断”，不给唯一应期。"},"Z47":{"title":"卦不明则再占","type":"Y","q":[{"b":"增","l":2143,"t":"倘遇卦之不明，再占是法：卦有恍惚者，再占一卦，不可妄断。","ch":"各门类应期总注章"}],"use":""},"Z48":{"title":"卦身不用","type":"Y","q":[{"b":"增","l":2116,"t":"身：古用卦身、世身，余试不验而不用，凡后所遇身字，即是世爻，非卦身、世身也。","ch":"各门类题头总注章"}],"use":""},"Z49":{"title":"星煞不能独操祸福","type":"Y","q":[{"b":"增","l":2881,"t":"然亦不能独操祸福之权，用神旺者，见之愈吉，用神失陷，虽有如无。","ch":"星煞章"}],"use":""},"Z50":{"title":"六神为附和之神","type":"Y","q":[{"b":"增","l":1329,"t":"然则六神竟而不验耶？非也，乃附和之神耳。","ch":"六神章"}],"use":""},"Z51":{"title":"游魂归魂须以用神为主","type":"Y","q":[{"b":"增","l":2154,"t":"野鹤曰：须以用神为主，然后以此参之。若舍用神，执此而断者，谬也。","ch":"归魂游魂章"}],"use":""},"Z52":{"title":"只验生旺墓绝","type":"Y","q":[{"b":"增","l":2073,"t":"余得验者，只验生旺墓绝，其余不验，不必用也。","ch":"生旺墓绝章"}],"use":"十二长生只取长生、帝旺、墓、绝四者，并且默认折叠。"},"Z53":{"title":"长生、绝须看旺衰","type":"H","q":[{"b":"增","l":2085,"t":"觉子曰：金虽长生在巳，须宜金爻旺相，或日月动爻生扶","ch":"生旺墓绝章"},{"b":"增","l":2085,"t":"倘若金爻休囚无气，再遇巳午火多者，烈火煎金，则论克不论生。","ch":"生旺墓绝章"},{"b":"增","l":2086,"t":"土爻虽绝于巳，必须休囚无气，又逢巳者，方谓之绝。若土爻旺相，或得日月动爻生扶，再遇巳爻者，巳火反能生土，则论生不论绝。","ch":"生旺墓绝章"}],"use":"爻休囚无扶时不算“长生于日”；爻旺相或有生扶时不算“绝于日”。"},"Z54":{"title":"独发独静","type":"Y","q":[{"b":"增","l":2757,"t":"五爻俱动，一爻不动，谓之独静；五爻不动，一爻独动，谓之独发。","ch":"独发章"},{"b":"增","l":2758,"t":"事之成败，由乎用神，应期迟速，亦由乎用神。","ch":"独发章"},{"b":"增","l":2758,"t":"如舍其用神，执以决事者则不然。","ch":"独发章"}],"use":"一爻独发或一爻独静时只作标注，判断仍以用神为主，不拿独发爻代替用神。"},"P01":{"title":"关键词只出候选","type":"P","q":[],"use":"问题文字里的关键词（车、钱、上班、女友……）只用来提出“候选用神”，状态为“待确认”；未经用户确认不称“用神已定”。"},"P02":{"title":"旺衰不单断吉凶","type":"P","q":[],"use":"依 Z15、Z32、Z43、Z49，旺相/休囚/空/破都只是条件，程序不写“某爻旺=事必成”。"},"P03":{"title":"一事多问分开看","type":"P","q":[],"use":"买卖类拆成“标的条件/资金/阻力/成交”，他人行动类拆成“本人/事项/是否实际去做”，各列支持、阻碍、不确定，不合并为一句结论。依 Z10 及 Z47（卦不明再占）。"},"P04":{"title":"动爻克伏神","type":"P","q":[],"use":"Z38 有“伏神得动爻生”，Z39 未列“动爻克伏”。程序把动爻克伏神列为阻碍，并注明原书未列为不得出之条。"},"P05":{"title":"两现无法取舍时并看","type":"P","q":[],"use":"Z11、Z12 都分不出时，两爻并列为“用神（两现）”，不强选。"},"P06":{"title":"应期只列候选","type":"P","q":[],"use":"按 Z46 推出的日子只作候选；空、破、伏藏同时存在时证据不足，注明“不宜定期”。"},"P07":{"title":"女友、男友比照妻妾、夫","type":"P","q":[],"use":"Z04 有“妻妾”，Z02 有“妻占夫”，Z08 有男占女取财。程序把女友、男友比照取妻财、官鬼。"},"P08":{"title":"工作上班取官鬼","type":"P","q":[],"use":"Z02「一切拘束我身者是也」，程序把工作、职事归官鬼。问“某人去不去上班”时，主用神是这个人，官鬼只是辅助（事项）。官鬼弱只能说明事项一方条件弱，不能据此断定“不去”。"},"P09":{"title":"用神与世的关系","type":"P","q":[],"use":"所求之物与世相生合，或用神持世，列为“与我有缘之象”；相冲克则列为阻碍。原书各门类多有此法，但没有统一章句，所以降为程序归纳。"}}</script>

      {"id": "Waylay", "zh": "幻棱", "role": "决斗", "tags": ["speed", "teleport"], "escape": "strong", "defStyle": "主动", "altStyle": "信息", "abil": {"C": ["光棱闪爆", "Saturate", "投出后落地爆炸，使范围内所有玩家受阻滞"], "Q": ["光速飞跃", "Lightspeed", "向前冲刺两次（ALT 冲刺一次），只有第一段能向上"], "E": ["溯流回光", "Refract", "立即在当前位置放标记，再次激活回到标记；回程中免疫但看不到敌人；每两次击杀重置"], "X": ["时光修罗场", "Convergent Paths", "获得加速，并向前送出使所有玩家受阻滞的区域"]}, "duty": ["冲刺进点打第一枪", "打完回标记脱身"], "risks": ["标记放在会被对方看到的地方，回程正好落进枪口", "两段冲刺都用来进，回不来", "回程看不到敌人，回到标记后马上露头被补枪"], "atk": "先在 {retreatPt} 放 溯流回光(Refract) 标记；把 光棱闪爆(Saturate) 丢向 {risk0} 让那里的人受阻滞，再用 光速飞跃(Lightspeed) 冲过 {exit} 打第一枪；被先手立刻回标记，回程看不到敌人，回到后先贴掩体", "def": "在 {pos} 身后的撤退方向先放 溯流回光(Refract) 标记；对方进点时把 光棱闪爆(Saturate) 砸在入口人群上，打一枪就回标记，回来后不在原地再露头", "escNote": "溯流回光的标记就是退路：先放标记再交火；回程中看不到敌人"},
      {"id": "Breach", "zh": "铁臂", "role": "先锋", "tags": ["flash", "stun", "explosive"], "escape": "weak", "defStyle": "信息", "altStyle": "稳健", "abil": {"C": ["剧震余波", "Aftershock", "穿墙送出区域，爆炸并连续造成伤害（作用所有玩家）"], "Q": ["闪点爆破", "Flashpoint", "穿墙发射，爆炸闪光看向它的玩家"], "E": ["山崩地陷", "Fault Line", "按住增加距离，松开引爆区域，震荡所有玩家"], "X": ["惊雷卷地", "Rolling Thunder", "向前送出冲击波，震荡并击飞所有玩家"]}, "duty": ["隔墙闪光、震荡，替自己开路", "逼角落的人离开掩体"], "risks": ["技能作用所有玩家，把自己人也闪了震了", "交完技能自己先冲进去", "站在墙边放技能时被对方贴脸"], "atk": "在 {exit} 外的墙后用 闪点爆破(Flashpoint) 穿墙闪 {risk0}，或按住 山崩地陷(Fault Line) 震荡入口后的区域；{risk0} 角落有人不出来就隔墙丢 剧震余波(Aftershock) 逼他走；技能交完再在第二位跟进补枪", "def": "在 {pos} 听到对方在入口集结时，隔墙放 山崩地陷(Fault Line) 或 闪点爆破(Flashpoint) 打断进点，再从掩体边打一枪；这些技能对所有玩家生效，别震到自己人", "escNote": "没有位移技能：技能交完靠掩体，不和被震荡的人一起挤在入口"},
      {"id": "Fade", "zh": "黑梦", "role": "先锋", "tags": ["recon", "nearsight"], "escape": "weak", "defStyle": "信息", "altStyle": "稳健", "abil": {"C": ["黯兽", "Prowler", "可被破坏；向前送出，可按住引导，追逐看到的第一个敌人或魇迹，命中使其近视"], "Q": ["幽爪", "Seize", "投出（可提前落下），落地使敌人耳聋、衰减并被束缚"], "E": ["诡眼", "Haunt", "可被破坏；投出（可提前落下），落地标记并显示范围内、视线内的敌人"], "X": ["夜临", "Nightfall", "向前送出波，使敌人耳聋、衰减并被标记"], "P": ["魇迹", "Terror Trails", "被标记的敌人位置会被魇迹追踪"]}, "duty": ["先找到人在哪", "把躲在角落的人逼出来"], "risks": ["诡眼丢得太显眼被直接打掉", "拿到信息后自己第一个冲进去", "只顾操作技能，被对方直接压上来"], "atk": "过 {exit} 之前把 诡眼(Haunt) 丢向 {risk0}；看到人就放 黯兽(Prowler) 沿魇迹追过去让他近视，再跟着打；有人缩在角落不出来，用 幽爪(Seize) 把他束缚住", "def": "在 {pos} 听到脚步后丢 诡眼(Haunt) 确认人数再决定打不打；对方冲进入口时用 幽爪(Seize) 束缚，自己从掩体后补枪", "escNote": "没有位移技能：拿到信息后先报点、换位，而不是自己先冲"},
      {"id": "Gekko", "zh": "盖可", "role": "先锋", "tags": ["stun", "flash", "explosive"], "escape": "weak", "defStyle": "信息", "altStyle": "稳健", "abil": {"C": ["嗨爆全场", "Mosh Pit", "投出（ALT 抛投），落地区域先持续低伤害，再爆炸造成高伤害（作用所有玩家）"], "Q": ["顽皮搭档", "Wingman", "可被破坏；向前送出，追逐看到的第一个敌人并震荡；ALT 让它在目标包点下包或拆包"], "E": ["炫晕光波", "Dizzy", "可被破坏；投出后向视线内敌人发射等离子，使其致盲"], "X": ["无敌超鲨", "Thrash", "可被破坏；操控后扑击爆炸，拘禁所有玩家"], "P": ["球体回收", "Globule", "技能用后变成球体，靠近互动可回收，短暂冷却后获得新的次数"]}, "duty": ["让技能替自己先进点", "用顽皮搭档下包或拆包，自己在旁边看枪线"], "risks": ["球体不回收，下一回合技能不够", "顽皮搭档下包时自己站在空地上", "技能被打掉还硬进"], "atk": "先放 顽皮搭档(Wingman) 从 {exit} 跑进去探路，碰到人会被震荡；同时丢 炫晕光波(Dizzy) 致盲 {risk0} 后再进；包点清得差不多时用 顽皮搭档 的 ALT 下包，自己在旁边架入口；能回收的球体记得捡", "def": "在 {pos} 对方进点时丢 炫晕光波(Dizzy) 再打一枪；对方下包后把 嗨爆全场(Mosh Pit) 砸在炸弹上逼他们离开；需要拆包时可让 顽皮搭档(Wingman) 去拆，自己看着入口", "escNote": "没有位移技能：让技能先进去，自己不要跟技能一起露头"},
      {"id": "KAY/O", "zh": "K/O", "role": "先锋", "tags": ["flash", "explosive"], "escape": "weak", "defStyle": "主动", "altStyle": "信息", "abil": {"C": ["碎片溢出", "FRAG/ment", "投出（ALT 抛投），落地爆炸并连续多次脉冲伤害（作用所有玩家）"], "Q": ["闪存过载", "FLASH/drive", "投出（ALT 抛投），延迟后爆炸，闪光看向它的玩家"], "E": ["零点嗅探", "ZERO/point", "可被破坏；投出后在表面脉冲，压制范围内的敌人"], "X": ["无效命令", "NULL/cmd", "立即进入过载并反复发出压制脉冲；过载给战斗兴奋；受到致命伤害时倒地，可被扶起"]}, "duty": ["先压制再进点，抢第一枪", "用碎片溢出逼掉角落"], "risks": ["闪存过载有延迟，丢早了对方已经转头", "零点嗅探被打掉后仍以为对方被压制", "无效命令倒地后指望队友来扶"], "atk": "先把 零点嗅探(ZERO/point) 丢到 {exit} 后面压制里面的人；再用 闪存过载(FLASH/drive) 闪 {risk0}，爆炸后马上进；{risk0} 角落有人不出来，丢 碎片溢出(FRAG/ment) 逼他离开", "def": "在 {pos} 对方挤在入口时丢 碎片溢出(FRAG/ment) 拖住，冲进来的人用 闪存过载(FLASH/drive) 反闪后打一枪就换位", "escNote": "没有位移技能；无效命令期间被打倒还能被扶起，但要有队友在旁边，不能当成退路"},
      {"id": "Skye", "zh": "斯凯", "role": "先锋", "tags": ["flash", "stun"], "escape": "weak", "defStyle": "信息", "altStyle": "主动", "abil": {"C": ["愈生之息", "Regrowth", "按住治疗范围内视线内的队友，治疗量有限，不能治疗自己"], "Q": ["辟林之虎", "Trailblazer", "可被破坏；操控后扑击爆炸，震荡所有玩家，直接命中对敌人造成伤害"], "E": ["引路之隼", "Guiding Light", "向前送出，可按住引导，再次激活引爆，闪光看向它的玩家"], "X": ["追猎之灵", "Seekers", "可被破坏；最多放出三个，追逐最近的三个敌人，命中使其近视并减速"]}, "duty": ["用辟林之虎先探路", "自己引闪光自己跟进"], "risks": ["以为能给自己回血，残血继续打", "操控辟林之虎时本人站在空地", "闪光引爆时机不对，闪到自己"], "atk": "先操控 辟林之虎(Trailblazer) 从 {exit} 进去看 {risk0}，有人就扑上去震荡；再把 引路之隼(Guiding Light) 引过拐角引爆，闪光后马上跟进；愈生之息(Regrowth) 不能奶自己，残血就退", "def": "在 {pos} 先用 辟林之虎(Trailblazer) 沿对方来路探有没有人前压；对方进点时把 引路之隼(Guiding Light) 引到入口引爆再打", "escNote": "没有位移技能，也不能给自己回血：受伤先退到掩体"},
      {"id": "Sova", "zh": "猎枭", "role": "先锋", "tags": ["recon", "explosive"], "escape": "weak", "defStyle": "信息", "altStyle": "稳健", "abil": {"C": ["枭型无人机", "Owl Drone", "可被破坏；操控后射出飞镖，命中后反复显示敌人位置"], "Q": ["雷击箭", "Shock Bolt", "射出后碰到表面爆炸，伤害所有玩家；可蓄力，ALT 增加最多两次反弹"], "E": ["寻敌箭", "Recon Bolt", "可被破坏；射出后反复显示附近范围内、视线内的敌人；可蓄力、反弹"], "X": ["狂猎之怒", "Hunter's Fury", "射出伤害区域，可再射两次；被命中的敌人对猎枭显形"]}, "duty": ["远处先拿信息", "用雷击箭逼人换位"], "risks": ["射箭时站在对方能看到的位置", "寻敌箭显示了人，自己却第一个冲", "操控无人机时本人被摸"], "atk": "在 {retreatPt} 一侧先射 寻敌箭(Recon Bolt) 看 {exit} 后面有没有人；{risk0} 有人就用 雷击箭(Shock Bolt) 逼他换位；进点前再用 枭型无人机(Owl Drone) 确认一次，自己不第一个露头", "def": "在 {pos} 听到对方集结时射 寻敌箭(Recon Bolt) 看人数；对方挤在入口时用 雷击箭(Shock Bolt) 打伤害，再从掩体接第一枪", "escNote": "没有位移技能：射箭的位置要安全，射完立刻回掩体"},
      {"id": "Tejo", "zh": "钛狐", "role": "先锋", "tags": ["recon", "stun", "explosive"], "escape": "weak", "defStyle": "信息", "altStyle": "稳健", "abil": {"C": ["潜袭爬虫", "Stealth Drone", "可被破坏；操控后显示并压制附近范围内、视线内的敌人"], "Q": ["特快专递", "Special Delivery", "发射（ALT 带一次弹跳），碰面爆炸，震荡并伤害所有玩家"], "E": ["精准投放", "Guided Salvo", "打开战术地图选定位置，发射导弹到达后反复脉冲伤害所有玩家"], "X": ["末日审判", "Armageddon", "打开战术地图设定并转向，放出对所有玩家造成高伤害的冲击波"]}, "duty": ["用爬虫先看、先压制", "用地图导弹逼人离开位置"], "risks": ["打开战术地图时身边没人看着", "导弹打在自己人身上", "爬虫被打掉后仍按旧信息冲"], "atk": "先放 潜袭爬虫(Stealth Drone) 去 {exit} 后面看并压制；确认 {risk0} 有人，就打开战术地图用 精准投放(Guided Salvo) 打他的位置逼走；进点时 特快专递(Special Delivery) 震荡入口再跟进", "def": "在 {pos} 对方下包后用 精准投放(Guided Salvo) 打炸弹附近阻止他们守包；入口挤人时丢 特快专递(Special Delivery) 震荡后打一枪", "escNote": "没有位移技能：打开战术地图选点前先躲到安全角落"},
      {"id": "Astra", "zh": "星礈", "role": "控场", "tags": ["smoke", "stun", "wall"], "escape": "weak", "defStyle": "稳健", "altStyle": "信息", "abil": {"C": ["重力之阱", "Gravity Well", "激活一颗星，形成把所有玩家拉向中心的区域，随后爆炸并使所有玩家易伤"], "Q": ["新星脉冲", "Nova Pulse", "激活一颗星引爆，震荡被命中的所有玩家"], "E": ["星云", "Nebula", "激活一颗星，把它变成烟雾"], "X": ["宇宙分裂", "Cosmic Divide", "在星界形态中装备，设定、转向后生成不可摧毁、阻隔声音的墙"], "P": ["星界形态", "Astral Form", "进入星界形态放置星；互动可回收星，回收时形成短暂烟雾"]}, "duty": ["预放星，进点时一次封烟加控制", "用星云挡枪线"], "risks": ["星放得太早被对方看到位置", "进星界形态操作时本人被摸", "星都用完了还站在前排"], "atk": "开局在星界形态里把星放到 {exit} 和 {risk0} 附近；进点时把 {risk0} 的星变成 星云(Nebula) 挡视线，入口有人就用 新星脉冲(Nova Pulse) 震荡或 重力之阱(Gravity Well) 把人拉出来；自己在第二、第三位跟进", "def": "在 {pos} 前方的入口预放星；对方进点时 新星脉冲(Nova Pulse) 震荡或 重力之阱(Gravity Well) 拉人，自己在掩体后补枪；回收星会形成短暂烟雾，可以借烟后撤", "escNote": "没有位移技能：回收星会形成短暂烟雾，可以借这团烟后撤"},
      {"id": "Brimstone", "zh": "炼狱", "role": "控场", "tags": ["smoke", "explosive"], "escape": "weak", "defStyle": "稳健", "altStyle": "主动", "abil": {"C": ["振奋信标", "Stim Beacon", "立即投出，落地区域给友方战斗兴奋与加速"], "Q": ["燃烧榴弹", "Incendiary", "发射后落地形成伤害所有玩家的区域"], "E": ["空投烟幕", "Sky Smoke", "打开战术地图选定烟点，释放烟雾"], "X": ["天基光束", "Orbital Strike", "打开战术地图选定位置，持续造成高伤害（作用所有玩家）"]}, "duty": ["一次封住进点枪线", "下包后用火守包"], "risks": ["烟放早了，进点时烟已散", "打开战术地图时被摸", "火封在自己人要走的路上"], "atk": "用 空投烟幕(Sky Smoke) 封住 {risk0} 的视线，在 {retreatPt} 丢 振奋信标(Stim Beacon) 给友方加速后从 {exit} 跟进；下包后躲在烟后，有人拆包就用 燃烧榴弹(Incendiary) 封炸弹", "def": "在 {pos} 对方挤进入口时用 燃烧榴弹(Incendiary) 封住拖时间；回防时用 空投烟幕(Sky Smoke) 挡住守包人的枪线，再从烟边进", "escNote": "没有位移技能：靠烟和火拉开距离"},
      {"id": "Clove", "zh": "暮蝶", "role": "控场", "tags": ["smoke", "selfsustain"], "escape": "weak", "defStyle": "主动", "altStyle": "稳健", "abil": {"C": ["虹吸", "Pick-me-up", "对你伤害过或击杀的已死敌人使用，获得加速与超额生命"], "Q": ["整蛊", "Meddle", "投出后落地爆炸，使所有玩家衰减"], "E": ["霞染", "Ruse", "打开战术地图选定烟点放烟；死亡后仍可用霞染放短暂烟雾"], "X": ["化蝶", "Not Dead Yet", "死亡时激活，引导自我复活，引导中无法被触碰；复活后要拿到击杀或伤害助攻才能存活"]}, "duty": ["自己封烟、自己跟进打一枪", "先倒下也还能补烟"], "risks": ["没打出伤害就想用虹吸", "化蝶复活后拿不到击杀还是会死", "当控场却第一个冲进去，烟没放完"], "atk": "先用 霞染(Ruse) 挡住 {risk0}，再从 {exit} 跟进；入口近点先丢 整蛊(Meddle) 让他衰减再对枪；拿到击杀后对尸体用 虹吸(Pick-me-up) 加速回掩体；先倒下也能继续用 霞染 补烟", "def": "在 {pos} 对方进点时把 整蛊(Meddle) 砸在入口再打一枪；倒下后仍用 霞染(Ruse) 放短烟拖慢对方", "escNote": "虹吸要先伤到或击杀敌人才能用：没打出伤害就没有这层加速"},

      {"id": "Chamber", "zh": "尚勃勒", "role": "哨卫", "tags": ["trap", "teleport"], "escape": "strong", "defStyle": "稳健", "altStyle": "信息", "abil": {"C": ["贵宾限行", "Trademark", "可被破坏；放置后被范围内可见的敌人触发，形成使所有玩家减速的区域；可回收"], "Q": ["金牌猎头", "Headhunter", "装备手枪射击，ALT 开镜"], "E": ["闪转自如", "Rendezvous", "可被破坏；放置锚点，在范围内再次激活瞬间传送过去；可回收"], "X": ["孤高火力", "Tour De Force", "获得狙击枪，直接命中上半身致命；击杀后形成使所有玩家减速的区域"]}, "duty": ["长枪线打一枪就传送", "用贵宾限行看住侧翼"], "risks": ["锚点被打掉还以为有退路", "离开锚点范围后再打第二枪", "贪大招的第二枪"], "atk": "把 贵宾限行(Trademark) 留在 {retreatPt} 一侧防绕后；进 {exit} 前在身后放 闪转自如(Rendezvous) 锚点，用 金牌猎头(Headhunter) 打 {risk0} 一枪就在范围内传回", "def": "在 {pos} 附近放 闪转自如(Rendezvous) 锚点，打完第一枪立刻传送换位；侧翼放 贵宾限行(Trademark)，触发了就知道有人绕后", "escNote": "闪转自如只有在锚点范围内才能传送：锚点被打掉或离太远就没有退路"},

function sidePanel(d,v,hid,side,on){var P=v.plain[side],alt=hid===d.hero?d.altHero:d.hero,h=[];
 h.push('<div class="cur'+(on?'':' hide')+'" data-cur="'+side+'">');
 h.push('<div class="row" data-k="who"><b>玩谁</b><div class="who"><span class="hn">'+esc(v.heroZh)+'</span>'+(alt?'<button class="alt" type="button" data-hero="'+esc(alt)+'">'+(hid===d.hero?'备选：':'回到首选：')+esc(L.HEROX(alt).zh)+'</button>':'')+'</div></div>');
 if(P.note)h.push('<div class="pnote" data-k="pnote">'+esc(P.note)+'</div>');
 L.PLAIN_ROWS.forEach(function(r){h.push('<div class="row" data-k="'+r[0]+'"><b>'+r[1]+'</b><div>'+esc(P[r[0]])+'</div></div>');});
 h.push('<div class="row mem" data-k="remember"><b>本场记住</b><div>'+esc(v.plain.remember)+'</div></div>');
 h.push('</div>');return h.join('');}
function renderOrder(s,hid,side){var d=s.deploy,v=d.views[hid],h=[];
 h.push('<div class="mh"><b>'+esc(d.mapZh)+'</b>'+(d.tier==='limited'?'<span class="note lim">资料有限</span>':'')+'</div>');
 h.push('<div class="sideTg">'+[['atk','进攻'],['def','防守']].map(function(x){return '<button type="button" data-side="'+x[0]+'" class="'+(side===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div>');
 h.push(sidePanel(d,v,hid,'atk',side==='atk')+sidePanel(d,v,hid,'def',side==='def'));
 if(d.heroes.length>2)h.push('<details id="heroBox"><summary>其他英雄</summary><div class="chips" id="heroSw"></div></details>');
 return h.join('');}
function tacList(d,s){var h=[];d.tac[s].forEach(function(c){h.push('<div class="li">'+(c.chosen?'★ ':'')+'<b>方案'+c.slot+'·'+esc(c.slotZh)+'「'+esc(c.name)+'」</b>'+esc(c.archZh)+'｜'+esc(c.brief)+'｜卦'+c.no+'：<span class="v-'+c.verdict+'">「'+esc(c.shi)+'」</span><div class="note">撤退条件：'+esc(c.retreat)+'｜可执行：'+esc(c.execBy.map(L.heroZhX).join('、'))+(c.whyNot?'｜'+esc(c.whyNot):'')+(c.skipped.length?'｜顺延：'+esc(c.skipped.join('；'))+'不可执行':'')+'</div></div>');});
 d.excluded[s].forEach(function(x){h.push('<div class="li note">✗ '+esc(x.why)+'</div>');});
 h.push('<div class="li">取势：'+T(d.pick[s].why)+'</div>');return h.join('');}
function renderBasis(s,hid){var d=s.deploy,v=d.views[hid],o=v.order,h=[];
 h.push('<div class="note">一事一占：每卦先定题、后摇卦；各卦只回答自己的问题；先把每卦八项证据分主次综合出卦势，再比较两方案，不打分、不投票、不换算胜率。本场共起卦 '+L.allCasts(s).length+' 次（'+(s.prep?'备战 1':'未备战 0')+' + 进攻 '+d.casts.filter(function(c){return c.side==='atk'}).length+' + 防守 '+d.casts.filter(function(c){return c.side==='def'}).length+'），没有重摇；换英雄、攻守切换、复制、刷新都不起卦。</div>');
 h.push('<details class="gua" data-k="detail"><summary>详细战术（内部方案名、使用前提、被针对时、技能用法） '+TAG3+'</summary>');
 h.push(kv('本场之势',o.shi.t),kv('为什么选'+v.heroZh,o.heroWhy.t));
 [['atk','进攻细则'],['def','防守细则']].forEach(function(z){h.push('<div class="lbl">'+z[1]+'</div>');L.ORDER_ROWS[z[0]].forEach(function(x){h.push(kv(x[1],o[x[0]].t,x[0]));});h.push(kv('技能用法',v.plain[z[0]].skill));});
 h.push(kv('本场记住·来源',v.risk.from+'（'+v.risk.basis+'）'),kv('实时优先',o.live.t),'</details>');
 if(s.prep)h.push(prepBasis(s));
 h.push('<details class="gua" data-k="tactic"><summary>辨势与取势（进攻 / 防守各两方案） '+TAG3+TAG2+'</summary>');
 h.push('<div class="note">题目在起卦前全部定好并存档（'+esc(d.questions[0]?d.questions[0].setAt:'')+'）</div>');
 h.push('<div class="lbl">辨进攻之势</div>'+tacList(d,'atk')+'<div class="lbl">辨防守之势</div>'+tacList(d,'def'));
 if(d.tier==='limited')h.push(li('地图机制（有出处）：'+d.mech.join('；')));
 h.push('</details>');
 L.allCasts(s).filter(function(c){return c.kind!=='beizhan'}).forEach(function(c){h.push('<details class="gua" data-k="'+c.kind+'"><summary>卦'+c.no+'·'+esc(c.name)+(c.tacName?'·方案'+c.slot+'「'+esc(c.tacName)+'」':'')+'：'+vcls(c)+'</summary>'+castBasis(s,c)+'</details>');});
 h.push('<details class="gua" data-k="hero"><summary>择将匹配（'+esc(d.zjNote)+'）'+TAG3+'</summary>');
 d.heroes.forEach(function(r,i){h.push(li((i+1)+'. '+r.zh+'（'+r.id+'）：'+r.why+(r.canAtk?'':'｜进攻首选打法缺：'+r.missAtk.join('、'))+(r.canDef?'':'｜防守首选打法缺：'+r.missDef.join('、'))));});
 if(v.atk)h.push(li('进攻风险枪线：'+v.atk.risks.join('；')),li('进攻撤退通道：'+v.atk.retreats.join('；')));
 if(v.def)h.push(li('防守风险枪线：'+v.def.risks.join('；')),li('防守撤退通道：'+v.def.retreats.join('；')));
  h.push('<div class="note">各字段来源：'+esc(Object.keys(v.order).map(function(k){return k+'＝'+v.order[k].src.join('、')}).join('｜'))+'</div></details>');
 h.push('<details class="gua" data-k="prompt"><summary>外部 AI 复核提示词（已附在一键复制的开头）</summary><div class="chart">'+esc(L.REVIEW_PROMPT)+'</div></details>');
 return h.join('');}
function fullFor(s,no){var c=L.allCasts(s).filter(function(x){return x.no===no})[0];try{var r=C.build(c.values,c.time,{});var y=L.YONG[c.kind];var res=Z.analyze(r,{q:c.q,primary:y.primary,aux:y.aux,date:c.time});return Z.fullText(r,res,{q:c.q,time:c.timeStr},R);}catch(e){return '（重排失败：'+e.message+'）';}}
function bindFull(root,s){Array.prototype.forEach.call(root.querySelectorAll('[data-full]'),function(el){var d=el.parentNode;d.addEventListener('toggle',function(){if(d.open&&!el.textContent)el.textContent=fullFor(s,+el.getAttribute('data-full'));});});}
// V3 旧记录：只读显示存档里的文字（不重算、不改写、不删除）
function renderLegacy(s){var d=s.deploy,vv=s.__v||'V3',h=['<h2>【'+vv+' 旧记录·只读】'+esc(d?d.mapName:'未出征')+'</h2><div class="note">这是 '+vv+' 生成的记录，按当时存档原样显示，不用 V4.1 规则重判。</div>'];
 if(s.prep&&s.prep.ref)h.push(kv(vv+' 备战',(s.prep.ref.label||'')+'｜'+(s.prep.ref.discipline||'')));
 if(d&&d.views&&d.views[d.hero]){var o=d.views[d.hero].order;Object.keys(o).forEach(function(k){if(o[k]&&o[k].t)h.push(kv(k,o[k].t));});}
 var cs=(s.prep&&s.prep.cast?[s.prep.cast]:[]).concat(d&&d.casts?d.casts:[]);
 cs.forEach(function(c){h.push('<details class="gua"><summary>卦'+c.no+'·'+esc(c.name||'')+(c.tacName?'「'+esc(c.tacName)+'」':'')+'：'+esc(c.cls&&c.cls.label||'')+'</summary>'+li('问：'+c.q)+'<div class="chart">'+esc((c.coinText||[]).join('\n'))+'\n\n'+esc(L.chartText(c.chart).join('\n'))+'</div>'+(c.cls&&c.cls.steps?'<div class="note">'+esc(c.cls.steps.map(function(x){return x[0]+' '+x[1]}).join('；'))+'</div>':'')+'</details>');});
 return h.join('');}
// ---------- 舞台 ----------
var VIEW=null, READONLY=false, LEGACY=false;
function stage(n){['stPrep','stWait','stMap','stOrder'].forEach(function(x){$(x).classList.toggle('hide',n.indexOf(x)<0)});}
function render(){
 $('msg').textContent='';$('setBox').classList.remove('hide');
 var s=VIEW;
 $('copy').classList.toggle('hide',LEGACY);
 if(LEGACY){stage(['stOrder']);$('roNote').innerHTML='历史记录（旧版，只读） <button class="btn sm" id="backBtn" type="button">返回</button>';$('order').innerHTML=renderLegacy(s);$('basis').innerHTML='';$('again').classList.add('hide');return;}
 $('again').classList.remove('hide');
 if(!s){stage(['stPrep','stMap']);drawSettings();drawMaps();return;}
 if(!s.deploy){var live=!READONLY&&!s.void;stage(live?['stWait','stMap']:['stWait']);$('prepRes').innerHTML=renderPrep(s);
  if(live){drawSettings();drawMaps();$('setBox').classList.add('hide');}else $('voidBtn').classList.add('hide');
  if(!live)$('msg').innerHTML=(s.void?'这条备战已作废。':'历史记录（只读）。')+' <button class="btn sm" id="backBtn" type="button">返回</button>';
  $('voidBtn').onclick=function(){if(!VIEW||VIEW.deploy)return;VIEW.void=true;putSess(VIEW);setCur('');VIEW=null;MAPSEL='';$('setBox').classList.remove('hide');render();};
  return;}
 $('setBox').classList.remove('hide');
 stage(['stOrder']);
 var u=uiOf(s.id)||{hero:s.deploy.hero,side:'atk'};if(!s.deploy.views[u.hero])u.hero=s.deploy.hero;if(u.side!=='def')u.side='atk';
 $('roNote').innerHTML=READONLY?'历史记录（只读） <button class="btn sm" id="backBtn" type="button">返回</button>':'';
 $('order').innerHTML=renderOrder(s,u.hero,u.side);
 var sw=$('heroSw');if(sw)s.deploy.heroes.forEach(function(c){if(c.id===u.hero)return;
  var b=chip(c.zh,u.hero===c.id,function(){u.hero=c.id;setUi(s.id,u);render();});b.setAttribute('data-hero',c.id);sw.appendChild(b);});
 Array.prototype.forEach.call($('order').querySelectorAll('button.alt'),function(b){b.onclick=function(){u.hero=b.getAttribute('data-hero');setUi(s.id,u);render();};});
 $('basis').innerHTML=renderBasis(s,u.hero);bindFull($('basis'),s);
 Array.prototype.forEach.call($('order').querySelectorAll('[data-side]'),function(b){b.onclick=function(){u.side=b.getAttribute('data-side');setUi(s.id,u);
  Array.prototype.forEach.call($('order').querySelectorAll('[data-side]'),function(x){x.className=x===b?'on':'';});
  Array.prototype.forEach.call($('order').querySelectorAll('[data-cur]'),function(x){x.classList.toggle('hide',x.getAttribute('data-cur')!==u.side);});};});
 }
document.addEventListener('click',function(e){if(e.target&&e.target.id==='backBtn'){READONLY=false;LEGACY=false;var c=getSess(curId());VIEW=c&&!c.void?c:null;render();window.scrollTo(0,0);}});
function optRnd(){return window.__LZ_RND?{rnd:window.__LZ_RND,now:window.__LZ_NOW}:{};}
function inpNow(){return {heroes:S.heroes.slice(),prof:poolNow(),pref:S.pref,habits:S.habits.slice()};}
// 入口一：备战
$('prep').addEventListener('click',function(){
 var inp=inpNow();
 var v=L.validatePrep(inp);if(!v.ok){$('msg').textContent=v.msg;return;}
 var p;try{p=L.prepare(inp,optRnd());}catch(e){$('msg').textContent='出错：'+e.message;return;}
 if(p.error){$('msg').textContent=p.error;return;}
 var s={id:p.id,prep:p,deploy:null,void:false};putSess(s);setCur(s.id);
 MAPSEL='';VIEW=s;READONLY=false;LEGACY=false;render();animate([p.cast]);
});
// 入口二：临阵（有备战 → 绑定该备战；无备战 → 直接临阵）
$('deploy').addEventListener('click',function(){
 if(READONLY||LEGACY)return;
 var s=VIEW, inp;
 if(s){var p=s.prep.inputs;inp={map:MAPSEL,heroes:p.heroes.slice(),prof:p.prof.slice(),pref:p.pref,habits:p.habits.slice()};}
 else{inp=inpNow();inp.map=MAPSEL;}
 var v=L.validateDeploy(s,inp);if(!v.ok){$('msg').textContent=v.msg;return;}
 var d;try{d=L.deploy(s,inp,optRnd());}catch(e){$('msg').textContent='出错：'+e.message;return;}
 if(d.error){$('msg').textContent=d.error;return;}
 if(!s){s=L.newDirect(window.__LZ_NOW);setCur(s.id);}
 s.deploy=d;putSess(s);setUi(s.id,{hero:d.hero,side:'atk'});VIEW=s;render();window.scrollTo(0,0);animate(d.casts);
});
$('again').addEventListener('click',function(){stopAnim();setCur('');VIEW=null;READONLY=false;LEGACY=false;MAPSEL='';$('copyMsg').textContent='';render();window.scrollTo(0,0);});
function copy(txt){var ok=function(){$('copyMsg').textContent='已复制完整临阵分析（'+txt.length+' 字），开头已附复核提示词，可粘贴给外部 AI 独立复核。';};
 var fb=function(){var ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();var r=false;try{r=document.execCommand('copy');}catch(e){}document.body.removeChild(ta);if(r)ok();else{$('copyMsg').textContent='浏览器不允许自动复制，已在下方文本框选中，请长按复制。';var t2=document.createElement('textarea');t2.value=txt;t2.style.width='100%';t2.style.height='160px';$('copyMsg').appendChild(t2);t2.select();}};
 try{if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(ok,fb);else fb();}catch(e){fb();}}
$('copy').addEventListener('click',function(){var s=VIEW;if(!s||!s.deploy||LEGACY)return;var u=uiOf(s.id)||{hero:s.deploy.hero};copy(L.copyText(s,u.hero));});
// ---------- 历史（V4 + V3 旧记录只读） ----------
function legacy(){return jget(HK4,[]).map(function(x){x.__v='V4.0';return x;}).concat(jget(HK3,[]).map(function(x){x.__v='V3';return x;}));}
function drawHist(){var a=sessions(),b3=legacy(),el=$('hist');
 if(!a.length&&!b3.length){el.innerHTML='<div class="note">暂无记录'+(STORE_OK?'':'（本机存储不可用，记录只在本页有效）')+'</div>';return;}
 var row=function(s){var d=s.deploy,t=(s.prep?s.prep.createdAt:d?d.createdAt:'').replace('（北京时间）','');return '<button type="button" data-id="'+esc(s.id)+'">'+esc(t)+'｜'+(s.prep?'已备战':'未备战')+'｜'+(s.void?'已作废':d?esc(d.mapZh)+'·'+esc(L.HEROX(d.hero).zh)+'·'+L.allCasts(s).length+'卦':'待匹配')+'</button>';};
 var row3=function(s){var d=s.deploy;return '<button type="button" data-v3="'+esc(s.id)+'">['+s.__v+' 旧记录] '+esc(((s.prep&&s.prep.createdAt)||'').replace('（北京时间）',''))+'｜'+(d?esc(d.mapZh||''):'未出征')+'</button>';};
 el.innerHTML=a.map(row).join('')+b3.map(row3).join('')+(STORE_OK?'':'<div class="note">本机存储不可用，记录只在本页有效</div>');
 Array.prototype.forEach.call(el.querySelectorAll('button[data-id]'),function(b){b.onclick=function(){var s=getSess(b.getAttribute('data-id'));if(!s)return;stopAnim();VIEW=s;LEGACY=false;READONLY=s.id!==curId()||s.void;MAPSEL='';render();window.scrollTo(0,0);};});
 Array.prototype.forEach.call(el.querySelectorAll('button[data-v3]'),function(b){b.onclick=function(){var s=legacy().filter(function(x){return x.id===b.getAttribute('data-v3')})[0];if(!s)return;stopAnim();VIEW=s;LEGACY=true;READONLY=true;render();window.scrollTo(0,0);};});}
$('histBox').addEventListener('toggle',drawHist);
// ---------- 关于判断（折叠）/ 页脚 ----------
$('about').innerHTML='· 卦象只作传统象义参考：'+esc(L.HONEST)+'；不换算胜率，不推断敌人站位，不预测比赛结果；'+esc(L.LIVE)+'。<br>· 卦势只在现实可行的打法之间做取舍，不会因为卦象推你去做危险动作；世爻旺不等于前压，世爻弱不等于后撤。<br>· 战术来自本地静态规则库 '+esc(DB.dbVersion)+'（'+esc(DB.updated)+'，'+esc(DB.gameVersion)+'），游戏更新后可能过时；点位只用官方名称；'+DB.pool.filter(function(id){return L.MAPX(id).tier!=='full'}).map(function(id){return esc(L.MAPX(id).zh)}).join('、')+' 资料有限，只给通用打法。<br>· 本页离线运行，没有接入任何大模型，不联网。<br>· 资料来源：'+DB.sources.map(function(x){return esc(x.id+'：'+x.t)}).join('；');
$('foot').innerHTML=esc(L.VER)+'（用户称 V3.1 极简实战版）'+(STORE_OK?'':'｜本机存储不可用：设置与历史只在本页有效');
// ---------- 启动：刷新/重开不起卦，只读存档 ----------
(function(){var c=getSess(curId());VIEW=c&&!c.void?c:null;render();drawHist();})();
window.__LZ={L:L,C:C,Z:Z,DB:DB,sessions:sessions,legacy:legacy,cur:function(){return VIEW},storeOk:function(){return STORE_OK},render:render,animMs:ANIM_MAX};
})();
